<title>Volta Rápida</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0C1014">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#0C1014; --panel:#151B21; --line:#232C34; --line2:#1A2229;
    --tx:#DFE6EB; --tx2:#93A0AA; --tx3:#65727C;
    --amber:#E9992B; --patina:#5AA894; --oxide:#D2604A;
    --f-d: Bahnschrift,"DIN Alternate","Roboto Condensed","Arial Narrow",ui-sans-serif,sans-serif;
    --f-b: "Segoe UI",system-ui,-apple-system,sans-serif;
    --f-m: ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:var(--bg);color:var(--tx);font-family:var(--f-b);
       -webkit-font-smoothing:antialiased;user-select:none;
       touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100vw;height:100vh}

  .ui{position:fixed;pointer-events:none}
  .ui *{pointer-events:auto}

  /* ── barra de topo ── */
  #topo{top:0;left:0;right:0;display:flex;align-items:center;gap:20px;
        padding:12px 18px;background:linear-gradient(180deg,rgba(8,11,14,.92),rgba(8,11,14,0))}
  #topo .marca{font-family:var(--f-d);font-size:19px;letter-spacing:.05em;text-transform:uppercase}
  #topo .marca b{color:var(--amber);font-weight:600}
  .pilha{display:flex;flex-direction:column;gap:2px}
  .rot{font-family:var(--f-m);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
  .val{font-family:var(--f-d);font-size:17px;font-variant-numeric:tabular-nums}
  #barraE{width:150px;height:5px;background:var(--line);position:relative;overflow:hidden}
  #barraE i{position:absolute;inset:0 auto 0 0;background:var(--amber);transition:width .25s}
  .cresce{flex:1}

  /* ── navegação ── */
  #nav{top:12px;right:18px;display:flex;gap:5px}
  #nav button,.btn{font-family:var(--f-d);font-size:13px;letter-spacing:.05em;text-transform:uppercase;
     background:rgba(21,27,33,.9);color:var(--tx2);border:1px solid var(--line);
     padding:8px 15px;cursor:pointer;transition:.12s}
  #nav button:hover,.btn:hover{color:var(--tx);border-color:var(--tx3)}
  #nav button[aria-pressed=true]{background:var(--amber);color:#141414;border-color:var(--amber);font-weight:600}
  .btn.p{background:var(--amber);color:#141414;border-color:var(--amber);font-weight:600}
  .btn.p:hover{background:#c9821f;color:#141414}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  /* ── garagem ── */
  #garagem{right:0;top:64px;bottom:0;width:330px;background:rgba(21,27,33,.94);
           border-left:1px solid var(--line);overflow-y:auto;padding:0 0 20px}
  #garagem::-webkit-scrollbar{width:8px}
  #garagem::-webkit-scrollbar-thumb{background:var(--line)}
  .grp{padding:14px 16px;border-bottom:1px solid var(--line2)}
  .grp h3{font-family:var(--f-m);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;
          color:var(--amber);margin:0 0 10px;font-weight:400}
  .opc{display:flex;flex-direction:column;gap:4px}
  .opc button{text-align:left;font-family:var(--f-b);font-size:13px;background:#10151A;
      color:var(--tx2);border:1px solid var(--line);padding:7px 11px;cursor:pointer;
      display:flex;justify-content:space-between;align-items:center;gap:8px}
  .opc button:hover{border-color:var(--tx3);color:var(--tx)}
  .opc button>span{flex:1 1 auto;min-width:0}
  .opc .preco{flex:0 0 auto}
  .opc button[aria-pressed=true]{border-color:var(--amber);color:var(--tx);background:#1C232A}
  .opc button[aria-pressed=true]::after{content:"●";color:var(--amber);font-size:9px}
  .opc small{color:var(--tx3);font-family:var(--f-m);font-size:10px}

  .st{display:grid;grid-template-columns:76px 1fr 30px;gap:8px;align-items:center;margin-bottom:6px}
  .st .n{font-size:12px;color:var(--tx2)}
  .st .b{height:4px;background:var(--line);position:relative;overflow:hidden}
  .st .b i{position:absolute;inset:0 auto 0 0;background:var(--amber);transition:width .18s}
  .st .b.g i{background:var(--patina)} .st .b.r i{background:var(--oxide)}
  .st .q{font-family:var(--f-m);font-size:10.5px;text-align:right;font-variant-numeric:tabular-nums}
  .grp h3 .dur{float:right;font-family:var(--f-m);font-size:10px;letter-spacing:.06em;text-transform:none}
  .prox{background:#10161C}
  .prox .pisoNome{font-family:var(--f-d);font-size:27px;color:var(--amber);line-height:1;text-transform:uppercase}
  .prox .pisoDica{font-size:12.5px;color:var(--tx2);margin-top:4px}
  .opc button em{font-style:normal;font-family:var(--f-m);font-size:9.5px;letter-spacing:.08em;
                 text-transform:uppercase;margin-left:5px}
  .opc button em.bom{color:var(--patina)} .opc button em.ruim{color:var(--oxide)}
  .opc button.trava{opacity:.45}
  .opc button.trava.pode{opacity:.85;border-color:var(--amber)}
  .opc button.trava::after{content:none}
  .opc .preco{font-family:var(--f-m);font-size:10.5px;color:var(--amber);white-space:nowrap}
  .btn.semGrana{opacity:.45}

  /* ── HUD de corrida ── */
  #hud{inset:0;display:none}
  #hud.on{display:block}
  #vel{left:34px;bottom:28px;position:absolute;display:flex;align-items:baseline;gap:8px}
  #vel .n{font-family:var(--f-d);font-size:64px;line-height:.85;font-variant-numeric:tabular-nums;
          text-shadow:0 2px 18px rgba(0,0,0,.8)}
  #vel .u{font-family:var(--f-m);font-size:11px;letter-spacing:.16em;color:var(--tx3)}
  #tempos{right:24px;top:76px;position:absolute;text-align:right}
  #tempos .l{font-family:var(--f-m);font-size:10px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase}
  #tempos .t{font-family:var(--f-d);font-size:30px;font-variant-numeric:tabular-nums;line-height:1.05}
  #tempos .t.d{font-size:17px;color:var(--tx2)}
  #volta{left:34px;top:76px;position:absolute}
  #volta .v{font-family:var(--f-d);font-size:32px;line-height:1}
  #volta .p{font-family:var(--f-m);font-size:11px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase}
  #volta .piso{font-family:var(--f-m);font-size:11px;letter-spacing:.16em;color:var(--amber);
               text-transform:uppercase;margin-top:6px}
  #nitro{position:absolute;left:34px;bottom:118px;width:240px}
  #nitro .nb{height:11px;background:rgba(10,14,18,.8);position:relative;overflow:hidden;margin-top:5px;
             border:1px solid rgba(255,255,255,.10)}
  #nitro .nb i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#3E8A5B,#E9992B,#FFD36B);width:0%;
               transition:width .08s linear}
  #item{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);text-align:center;width:340px}
  #item .cx{border:2px solid var(--line);background:rgba(12,16,20,.88);padding:11px 8px;
            transition:border-color .15s, box-shadow .15s}
  #item .cx span{font-family:var(--f-d);font-size:30px;letter-spacing:.03em;text-transform:uppercase;
                 line-height:1;display:block}
  #item .oq{font-family:var(--f-m);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
            color:var(--tx3);margin-top:7px}
  #item.tem .cx{box-shadow:0 0 26px rgba(233,153,43,.30)}
  @keyframes bate{0%{transform:scale(1)}35%{transform:scale(1.13)}100%{transform:scale(1)}}
  #item.novo .cx{animation:bate .45s ease-out}
  #carro{position:absolute;left:34px;bottom:112px;display:flex;flex-direction:column;gap:7px;width:210px}
  .med{display:grid;grid-template-columns:44px 1fr 40px;gap:8px;align-items:center}
  .med span{font-family:var(--f-m);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--tx3)}
  .med .bar{height:5px;background:rgba(10,14,18,.75);position:relative;overflow:hidden}
  .med .bar i{position:absolute;inset:0 auto 0 0;background:var(--patina);width:100%;transition:width .1s linear}
  .med b{font-family:var(--f-m);font-size:11px;text-align:right;font-variant-numeric:tabular-nums;
         text-shadow:0 1px 6px rgba(0,0,0,.9)}
  #aviso{position:absolute;left:50%;top:38%;transform:translateX(-50%);text-align:center;
         font-family:var(--f-d);font-size:78px;letter-spacing:.02em;text-shadow:0 4px 30px rgba(0,0,0,.9)}
  #aviso small{display:block;font-size:15px;letter-spacing:.2em;color:var(--tx2);margin-top:4px}
  #pericia{position:absolute;left:50%;top:54%;transform:translateX(-50%);
     font-family:var(--f-d);font-size:26px;color:var(--amber);opacity:0;text-shadow:0 2px 14px rgba(0,0,0,.9)}

  /* ── painel de fim / mapa ── */
  #modal{inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,11,14,.82)}
  #modal.on{display:flex}
  .cartao{background:var(--panel);border:1px solid var(--line);padding:30px 34px;min-width:380px;max-width:92vw}
  .cartao h2{font-family:var(--f-d);font-size:34px;text-transform:uppercase;margin:0 0 4px;letter-spacing:.02em}
  .cartao .sub{font-family:var(--f-m);font-size:11px;letter-spacing:.14em;color:var(--tx3);
               text-transform:uppercase;margin-bottom:20px}
  .linha{display:flex;justify-content:space-between;gap:24px;padding:8px 0;border-top:1px solid var(--line2);
         font-size:14px}
  .linha b{font-family:var(--f-m);font-variant-numeric:tabular-nums}
  .linha.d b{color:var(--amber)}
  .acoes{display:flex;gap:8px;margin-top:22px}
  .acoes .btn{flex:1;text-align:center;padding:11px}

  /* ── controles de toque ────────────────────────────────────────────────
     Sem isto o jogo é assistível no celular e injogável, e a maior parte das
     pessoas abre link no telefone. */
  #toque{inset:0;display:none}
  #toque.on{display:block}
  /* manche: um polegar só, e o acelerador é automático */
  #manche{position:absolute;left:20px;bottom:18px;width:132px;height:132px;border-radius:50%;
          background:rgba(20,26,32,.42);border:2px solid rgba(255,255,255,.14);
          touch-action:none;-webkit-user-select:none;user-select:none;
          display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
  #manche i{width:56px;height:56px;border-radius:50%;background:rgba(233,153,43,.55);
            border:2px solid rgba(255,255,255,.30);display:block;
            transition:transform .04s linear;pointer-events:none}
  #manche.puxado i{background:rgba(233,153,43,.85)}
  #manche .mDica{position:absolute;bottom:-19px;left:0;right:0;text-align:center;
                 font-family:var(--f-m);font-size:9px;letter-spacing:.16em;
                 text-transform:uppercase;color:var(--tx3);pointer-events:none}
  .lado{position:absolute;display:flex;gap:12px;align-items:center}
  .lado.dir{right:18px;bottom:24px}
  .tq{font-family:var(--f-d);font-size:14px;letter-spacing:.05em;color:var(--tx);
      background:rgba(20,26,32,.62);border:2px solid rgba(255,255,255,.16);
      width:86px;height:86px;border-radius:50%;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      touch-action:none;-webkit-user-select:none;user-select:none;
      backdrop-filter:blur(3px)}
  .tq.grande{width:104px;height:104px;font-size:15px;
             background:rgba(233,153,43,.30);border-color:rgba(233,153,43,.55)}
  .tq.peq{width:68px;height:68px;font-size:11px}
  .tq.ativo{background:rgba(233,153,43,.72);border-color:var(--amber);color:#141414}
  #sairCorrida{position:absolute;top:8px;right:10px;width:38px;height:38px;border-radius:50%;
      background:rgba(20,26,32,.7);border:1px solid rgba(255,255,255,.18);color:var(--tx2);
      font-size:16px;cursor:pointer;display:none}
  #toque.on #sairCorrida{display:block}
  /* dica, não bloqueio: retrato tem que ser jogável, só mostra menos pista */
  #girar{left:50%;top:96px;transform:translateX(-50%);display:none;
         background:rgba(12,16,20,.92);border:1px solid var(--line);padding:9px 15px;
         font-family:var(--f-m);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
         color:var(--tx2);white-space:nowrap}
  #girar.on{display:block;animation:somedica 6s forwards}
  @keyframes somedica{0%,70%{opacity:1}100%{opacity:0;visibility:hidden}}

  /* ── telas estreitas ── */
  @media (max-width:860px){
    #topo{gap:12px;padding:9px 12px}
    #topo .marca{font-size:15px}
    #topo .pilha .val{font-size:14px}
    #barraE{width:88px}
    #nav{top:8px;right:10px;gap:3px}
    #nav button{font-size:11px;padding:6px 9px}
    /* deitado, divide a tela para o carro continuar visível enquanto você
       troca peça; em pé, ocupa tudo porque não cabe de outro jeito */
    #garagem{width:100%;top:56px;border-left:0;border-top:1px solid var(--line)}
    #vel .n{font-size:40px}
    #volta .v{font-size:22px}
    #tempos .t{font-size:20px}
    #tempos .t.d{font-size:13px}
    #tempos{top:60px;right:14px}
    #volta{top:60px;left:16px}
    #nitro{left:16px;bottom:auto;top:104px;width:140px}
    #item{width:210px;bottom:auto;top:128px;left:16px;transform:none;text-align:left}
    #item .cx{padding:7px 8px}
    #item .cx span{font-size:17px}
    #item .oq{font-size:9px;margin-top:4px}
    /* o velocímetro sai do canto: ali ele fica embaixo do botão de virar */
    #vel{left:50%;transform:translateX(-50%);bottom:8px;align-items:baseline}
    #vel .n{font-size:34px;text-shadow:0 2px 12px rgba(0,0,0,.95)}
    #vel .u{font-size:9px}
    #dica{display:none}
    #aviso{font-size:52px}
    .cartao{min-width:0;width:92vw;padding:22px 20px}
    .cartao h2{font-size:26px}
  }
  /* ── EM PÉ ─────────────────────────────────────────────────────────────
     O menu vira barra de abas embaixo, para nunca cobrir energia, perícia e
     sucata. A garagem vira gaveta de baixo, e o carro fica visível em cima. */
  @media (max-width:1000px) and (orientation:portrait){
    #topo{padding:10px 12px;gap:14px;flex-wrap:wrap}
    #topo .marca{font-size:16px;width:100%;margin-bottom:2px}
    #barraE{width:110px}
    #nav{top:auto;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);
         gap:0;background:rgba(12,16,20,.96);border-top:1px solid var(--line)}
    #nav button{border:0;border-right:1px solid var(--line2);padding:14px 4px;font-size:13px}
    #nav button:last-child{border-right:0}
    #garagem{top:auto;bottom:47px;height:58vh;width:100%;
             border-left:0;border-top:1px solid var(--line)}
    #toque .lado.dir{bottom:86px;right:14px}
    #manche{bottom:80px;left:14px;width:120px;height:120px}
    #manche i{width:50px;height:50px}
    #vel{bottom:58px}
    #volta{top:92px;left:14px}
    #tempos{top:92px;right:14px}
    #nitro{left:14px;right:14px;width:auto;top:auto;bottom:214px}
    #item{left:14px;right:14px;width:auto;top:auto;bottom:244px;transform:none;text-align:center}
    #item .cx span{font-size:16px}
    #nav.someNaCorrida{display:none}
  }
  @media (max-width:1000px) and (orientation:landscape){
    #garagem{width:47%;top:50px;border-left:1px solid var(--line);border-top:0}
    #topo{padding:7px 12px}
    #nav{top:6px}
  }
  @media (max-width:520px){
    .tq{width:70px;height:70px;font-size:21px}
    .tq.grande{width:88px;height:88px;font-size:27px}
    .tq.peq{width:62px;height:62px;font-size:10px}
  }
  /* pixel art precisa de vizinho-mais-próximo, senão borra e vira mingau */
  .ic{image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle;
      display:inline-block;flex:0 0 auto}
  .pilha .linha{display:flex;align-items:center;gap:7px}
  .grp h3 .ic{margin-right:6px;vertical-align:-6px}
  #item .cx{display:flex;align-items:center;justify-content:center;gap:12px}
  .opc button .ic{margin-right:8px}
  #dica{left:50%;bottom:22px;transform:translateX(-50%);font-family:var(--f-m);font-size:10.5px;
        letter-spacing:.11em;color:var(--tx3);text-transform:uppercase;text-align:center}
</style>

<canvas id="cv"></canvas>

<div class="ui" id="topo">
  <div class="marca">Circuito <b>Aberto</b></div>
  <div class="pilha"><div class="rot">Energia</div>
    <div class="linha"><span id="icE"></span>
      <div id="barraE"><i style="width:60%"></i></div>
      <div class="val" id="eTxt">480</div></div></div>
  <div class="pilha"><div class="rot">Perícia</div>
    <div class="linha"><span id="icP"></span><div class="val" id="pTxt">0</div></div></div>
  <div class="pilha"><div class="rot">Sucata</div>
    <div class="linha"><span id="icS"></span><div class="val" id="sTxt">0</div></div></div>
  <div class="cresce"></div>
</div>

<div class="ui" id="nav">
  <button id="nGar" aria-pressed="true">Garagem</button>
  <button id="nMapa" aria-pressed="false">Mapa</button>
  <button id="nCor" aria-pressed="false">Correr</button>
  <button id="nSom" aria-pressed="false" title="som do motor">Som</button>
</div>

<aside class="ui" id="garagem"></aside>

<div class="ui" id="hud">
  <div id="volta"><div class="p">Volta</div><div class="v"><span id="vAtual">1</span>/2</div>
    <div class="piso" id="pisoHud">Asfalto</div></div>
  <div id="tempos"><div class="l">Volta atual</div><div class="t" id="tAtual">0.00</div>
    <div class="l" style="margin-top:8px">Melhor</div><div class="t d" id="tMelhor">—</div></div>
  <div id="vel"><div class="n" id="velN">0</div><div class="u">km/h</div></div>
  <div id="nitro"><div class="rot">Nitro · segure SHIFT</div><div class="nb"><i id="bNitro"></i></div></div>
  <div id="item">
    <div class="cx" id="cxItem"><span id="icItem"></span><span id="qItem">vazio</span></div>
    <div class="oq" id="oqItem">pegue uma caixa na pista</div>
  </div>
  <div id="aviso"></div>
  <div id="pericia"></div>
</div>

<div class="ui" id="toque" hidden>
  <div id="manche" aria-label="direção"><i id="mancheBola"></i>
    <span class="mDica">guiar</span></div>
  <div class="lado dir">
    <button class="tq acao" data-k="e" aria-label="usar item">ITEM</button>
    <button class="tq acao grande" data-k="shift" aria-label="turbo">TURBO</button>
  </div>
  <button id="sairCorrida" aria-label="sair da corrida">✕</button>
</div>
<div class="ui" id="girar" hidden>Deite o celular para ver mais pista</div>
<div class="ui" id="modal"></div>
<div class="ui" id="dica"></div>

<script>
"use strict";
// atalho no topo: declarado com const, usado antes daqui dava zona morta
const $=id=>document.getElementById(id);

/* ── ÍCONES ──────────────────────────────────────────────────────────────
   Construídos em 3D com as MESMAS primitivas, a MESMA luz e a MESMA paleta do
   carro, e renderizados uma vez na partida num viewport de 64x64. O resultado
   vira data URI e some da memória de vídeo.

   Ícone gerado por IA nunca casa com o jogo porque não sai do mesmo
   renderizador — sombra diferente, contorno diferente, paleta parecida mas
   não igual. Feito aqui, nasce nativo por construção. E volta a respeitar a
   lei do projeto: tudo sai de código.

   O fundo é magenta puro, cor que não existe em nenhuma peça, e vira alfa na
   hora de virar PNG. */
const ICONE = {};
function icone(nome,tam){ return ICONE[nome]
  ? '<img class="ic" src="'+ICONE[nome]+'" width="'+tam+'" height="'+tam+'" alt="">'
  : ''; }

/* Preguiçosa de propósito: este bloco fica no topo do arquivo, antes de hex()
   existir. Montar a paleta na declaração cairia na zona morta do const. */
let PAL = null;
function montarPaleta(){
  PAL = {
    aco:    hex("#8A939B"), aco2:  hex("#5E666E"), grafite: hex("#2A323A"),
    ambar:  hex("#E9992B"), ambar2:hex("#B8720F"), verde:   hex("#5AA894"),
    oxido:  hex("#D2604A"), creme: hex("#E9E4DA"), preto:   hex("#141A20"),
    ouro:   hex("#D9A62B"), cobre: hex("#C07838"), vidro:   hex("#2E4450"),
  };
}

/* Cada ícone é uma função que recebe o construtor e devolve o quanto a

  pericia(B){

      B.boxR(Math.cos(a)*.85,Math.sin(a)*.85,0,.42,.24,.24,a,PAL.grafite); }

      B.boxR(Math.cos(a)*d, -.45+r()*.75, Math.sin(a)*d*.7, t,t*.7,t*.9, r()*3, r()<.35?PAL.aco2:PAL.aco);

    B.cilZ(.42,.34,.42,.34,.16,8,PAL.cobre);

  },
  turbo(B){

  recarga(B){

  estouro(B){

    for(let k=0;k<5;k++){ const a=k/5*6.2832;

  },
  trofeu(B){
    for(let i=0;i<12;i++){ const a=i/12*6.2832,a2=(i+1)/12*6.2832;
      const R1=.66,R2=.42;
      B.quad([Math.cos(a)*R1,.62,Math.sin(a)*R1],[Math.cos(a2)*R1,.62,Math.sin(a2)*R1],
             [Math.cos(a2)*R2,-.10,Math.sin(a2)*R2],[Math.cos(a)*R2,-.10,Math.sin(a)*R2],PAL.ouro); }
    B.disco(0,.62,0,.66,12,esc(PAL.ouro,1.4));
    B.cilY(0,-.34,0,.16,.50,8,PAL.ouro);

  cronometro(B){

      B.boxR(Math.cos(a)*.62,Math.sin(a)*.62,.20,.14,.10,.04,a,PAL.grafite); }
    return 2.4;
  },
  bandeira(B){
    B.cilY(-.86,0,0,.09,2.00,8,PAL.aco);
    for(let i=0;i<4;i++) for(let j=0;j<3;j++){
      const x=-.72+i*.44, y=.86-j*.40;
      B.box(x,y+Math.sin(i*1.1)*.10,0,.44,.40,.07,(i+j)%2?PAL.creme:PAL.grafite);

    return 2.5;
  },
  chave(B){

    return 2.6;
  },
};

/* Renderiza cada forma uma vez, num canto do canvas, e guarda como PNG. */
/* ALFA EXATO POR DOIS FUNDOS.
   Recortar por cor de chave deixa franja: o antialias mistura o fundo na
   borda, e nenhum limiar separa "meio magenta" de "objeto roxo". A saída é
   desenhar DUAS vezes, sobre magenta e sobre verde. Onde as duas leituras
   batem, é objeto opaco; onde diferem, a diferença É a transparência.
     p = O*(1-t) + fundo*t   →   t = (verde.g - magenta.g)/255
   Depois desfaz a pré-multiplicação para recuperar a cor limpa. */
function gerarIcones(){
  montarPaleta();
  const L=64;
  const c2=document.createElement("canvas"); c2.width=c2.height=L;
  const ctx=c2.getContext("2d");
  const img=ctx.createImageData(L,L);
  const bufM=new Uint8Array(L*L*4), bufV=new Uint8Array(L*L*4);

  gl.useProgram(pObj);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND);
  gl.uniform1f(gl.getUniformLocation(pObj,"uNeb"),1e6);
  gl.uniform3f(gl.getUniformLocation(pObj,"uTinta"),1,1,1);

  for(const nome of Object.keys(FORMAS)){
    const B=new M();
    const recuo=FORMAS[nome](B);
    const malha=subir(B);

    // 3/4 de cima, igual à garagem, para o ícone parecer o mesmo mundo
    const olho=[recuo*.62, recuo*.52, recuo*.78];
    const desenha=(cr,cg,cb,destino)=>{
      gl.viewport(0,0,L,L);
      gl.clearColor(cr,cg,cb,1);
      gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
      gl.uniformMatrix4fv(gl.getUniformLocation(pObj,"uP"),false,m4p(0.72,1,.1,60));
      gl.uniformMatrix4fv(gl.getUniformLocation(pObj,"uV"),false,m4look(olho,[0,0,0],[0,1,0]));
      gl.uniformMatrix4fv(gl.getUniformLocation(pObj,"uM"),false,m4pose(0,0,0,0));
      gl.uniform3fv(gl.getUniformLocation(pObj,"uEye"),new Float32Array(olho));
      gl.bindVertexArray(malha.vao);
      gl.drawArrays(gl.TRIANGLES,0,malha.n);
      gl.readPixels(0,0,L,L,gl.RGBA,gl.UNSIGNED_BYTE,destino);
    };
    desenha(1,0,1,bufM);      // magenta
    desenha(0,1,0,bufV);      // verde

    for(let y=0;y<L;y++) for(let x=0;x<L;x++){
      const o=((L-1-y)*L+x)*4, d=(y*L+x)*4;      // WebGL lê de baixo pra cima
      const t=cl((bufV[o+1]-bufM[o+1])/255,0,1); // quanto de fundo entrou
      const a=1-t;
      if(a<=0.004){ img.data[d+3]=0; continue; }
      // magenta é (255,0,255): VERMELHO e azul recebem fundo, verde não.
      // Corrigir só o azul deixava franja rosa sobre fundo claro.
      img.data[d]  =cl((bufM[o]  -255*t)/a,0,255);
      img.data[d+1]=cl( bufM[o+1]     /a,0,255);
      img.data[d+2]=cl((bufM[o+2]-255*t)/a,0,255);
      img.data[d+3]=Math.round(a*255);
    }
    ctx.putImageData(img,0,0);
    ICONE[nome]=c2.toDataURL("image/png");
  }
  gl.enable(gl.BLEND);
  gl.clearColor(0,0,0,1);
}

/* ══════════════════════════════════════════════════════════════════════════
   CIRCUITO ABERTO — vertical slice (Fase 2)

   O que este protótipo existe para responder: É DIVERTIDO SEM PRÊMIO NENHUM?
   Não há mercado, não há Ficha, não há dinheiro. Só o laço:
       mapa idle rende Energia → Energia paga corrida → corrida dá Perícia,
       Sucata e desgaste → peça melhor → carro melhor → corrida melhor.

   Arquitetura provada aqui: as MESMAS malhas low-poly servem a câmera
   traseira da corrida e a câmera de cima do mapa idle. Câmera não é decisão
   de asset. Zero textura, zero modelo importado, zero dependência.

   O bloco NÚCLEO abaixo é determinístico e não toca em DOM nem em WebGL —
   é o que vira código de servidor na Fase 3 sem reescrever nada.
   ══════════════════════════════════════════════════════════════════════════ */

/* ─────────────────────────── util ─────────────────────────── */
const cl=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const suave=t=>{t=cl(t,0,1);return t*t*(3-2*t);};
const gauss=(x,m,s)=>Math.exp(-((x-m)*(x-m))/(2*s*s));
function semente(n){let a=n>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const hex=h=>{const n=parseInt(h.slice(1),16),f=v=>Math.pow(v/255,2.2);
  return[f((n>>16)&255),f((n>>8)&255),f(n&255)];};
const esc=(c,k)=>[c[0]*k,c[1]*k,c[2]*k];
const tempo=s=>s<0?"—":(Math.floor(s/60)?Math.floor(s/60)+":":"")+ (s%60).toFixed(2).padStart(Math.floor(s/60)?5:4,"0");

  for(const k of ["chassi","motor","rodas","aero"]){
    const falta=100-(estado.dur[k]||0);
    t += falta * (0.5 + PECAS[k][estado.build[k]].custo/900);
  }
  return Math.round(t);
}
function atributos(piso){
  const P=PISOS[piso||estado.piso||"asfalto"];
  const p=k=>PECAS[k][estado.build[k]];
  const c=p("chassi"), m=p("motor"), r=p("rodas"), a=p("aero");
  const nomePiso=piso||estado.piso||"asfalto";
  const af=(x)=>(x.piso&&x.piso[nomePiso])||1;      // afinidade da peça com o piso
  const peso=c.peso*m.peso;
  const potencia = 11.5 * c.pot * m.pot * fatorDur("motor") / peso;
  const arrasto  = 0.0026 * a.arrasto * P.arrasto;
  // velocidade terminal resolvida da própria equação de movimento, para o
  // número da garagem ser o número que o carro faz de verdade na pista
  const vmax = (-0.18 + Math.sqrt(0.0324 + 4*arrasto*potencia)) / (2*arrasto);
  return {
    potencia, arrasto, vmax, peso, piso:nomePiso,
    aderencia: 3.05 * c.aderencia * r.aderencia * a.aderencia
             * P.aderencia * af(c) * af(r) * af(a)
             * (0.70+0.30*fatorDur("rodas")) * (0.85+0.15*fatorDur("chassi")),
    terra: 0.55 + 0.45*af(c)*af(r),      // o quanto sofre fora da pista
  };
}

/* ── pista: laço fechado gerado por spline, com blocos de meio-fio ── */
function gerarPista(sem){
  const r=semente(sem), N=13, ctrl=[];
  for(let i=0;i<N;i++){
    const a=i/N*Math.PI*2, rad=180+r()*95;
    ctrl.push([Math.cos(a)*rad, Math.sin(a)*rad]);
  }
  const cr=(p0,p1,p2,p3,t)=>{const t2=t*t,t3=t2*t;
    return [0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
            0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)];};
  const SUB=14, meio=[];
  for(let i=0;i<N;i++) for(let s=0;s<SUB;s++)
    meio.push(cr(ctrl[(i-1+N)%N],ctrl[i],ctrl[(i+1)%N],ctrl[(i+2)%N],s/SUB));

  // tangente, normal e largura variável (reta larga, curva estreita)
  const n=meio.length, dados=[];
  let total=0;
  for(let i=0;i<n;i++){
    const a=meio[(i-1+n)%n], b=meio[i], c=meio[(i+1)%n];
    let tx=c[0]-a[0], tz=c[1]-a[1]; const l=Math.hypot(tx,tz)||1; tx/=l; tz/=l;
    const curv=Math.abs(Math.atan2(c[1]-b[1],c[0]-b[0])-Math.atan2(b[1]-a[1],b[0]-a[0]));
    const larg=19 - cl(curv,0,.5)*7;
    const dl=Math.hypot(b[0]-meio[(i-1+n)%n][0], b[1]-meio[(i-1+n)%n][1]);
    total+=dl;
    dados.push({x:b[0],z:b[1],tx,tz,nx:-tz,nz:tx,larg,s:total});
  }
  return {pontos:dados, n, comprimento:total};
}
/* Índice do ponto mais próximo — busca local, porque o carro anda contínuo. */
function maisProximo(pista, x, z, ult){
  let mel=ult, md=1e9;
  for(let k=-14;k<=14;k++){
    const i=(ult+k+pista.n)%pista.n, p=pista.pontos[i];
    const d=(p.x-x)**2+(p.z-z)**2;
    if(d<md){md=d;mel=i;}
  }
  return {i:mel, dist:Math.sqrt(md)};
}

/* ── física arcade, passo fixo, determinística ──
   O deslize nasce de a velocidade NÃO acompanhar a rotação do carro: gira
   forte em velocidade, a lateral cresce, o pneu arrasta e o carro derrapa.
   Determinística de propósito: na Fase 3 o servidor re-simula o log de
   entradas e compara, que é como o Trackmania valida tempo. */
const DT=1/120;
const ORCAMENTO_DESLIZE = 4.2;   // m/s de lateral que o pneu aguenta de graça

/* Temperatura de motor e desgaste de pneu FORAM REMOVIDOS.
   Medido: num ritmo humano o motor chegava a 92° e o pneu a 75%, o que dava
   9% de perda de força e 11% de aderência — número que se mexe e consequência
   que não morde. Pior: o único jeito de esfriar era parar de acelerar, ou
   seja, a mecânica pedia que você jogasse menos. Limitação igual pra todos,
   sem decisão nenhuma no meio.
   O custo do turbo agora é o próprio NITRO, que é recurso conquistado
   derrapando e pegando vácuo. */

/* ── NITRO ───────────────────────────────────────────────────────────────
   Enche derrapando e pegando vácuo, gasta no turbo. E o turbo é a FONTE DE
   CALOR: motor esquentando sozinho não mordia (a 92° a perda é 9%, ninguém
   sente), mas como preço de usar o turbo ele passa a ser uma decisão. Toda
   peça alimenta a outra: derrapa → nitro → turbo → calor → tem que aliviar. */
const NITRO = { max:100, gasto:34, forca:1.85, calor:0, porDeslize:11, porVacuo:19, porAtraso:16 };

/* ── ITENS ───────────────────────────────────────────────────────────────
   Peso por posição: quem está atrás tira coisa melhor. É o que mantém a
   corrida viva depois que alguém abre vantagem. */
const ITENS = {
  turbo:  { nome:"Turbo",  cor:"#E9992B", peso:[4,5,7,8], ic:"turbo" },
  oleo:   { nome:"Óleo",   cor:"#7A6A50", peso:[7,5,3,2], ic:"oleo" },
  tranco: { nome:"Tranco", cor:"#D2604A", peso:[0,3,6,9], ic:"tranco" },
  reparo: { nome:"Recarga",cor:"#5AA894", peso:[3,4,5,5], ic:"recarga" },
  // ESTOURO: só cai pra quem está em 3º ou 4º e acerta o LÍDER onde ele
  // estiver. É o que impede a corrida de virar procissão depois que alguém
  // abre vantagem — sem algo assim, quem lidera aos 40% vence sempre.
  estouro:{ nome:"Estouro", cor:"#E9552B", peso:[0,1,5,9], ic:"estouro" },
};
function sortearItem(posicao){
  const ch=Object.keys(ITENS), i=cl(posicao-1,0,3);
  let soma=0; for(const k of ch) soma+=ITENS[k].peso[i];
  let r=Math.random()*soma;
  for(const k of ch){ r-=ITENS[k].peso[i]; if(r<=0) return k; }
  return "turbo";
}


function passo(c, ent, at, naPista, terra){
  const spd=Math.hypot(c.vx,c.vz);

  // volante: afina em alta velocidade, mas nunca some
  const dirMax=1-0.40*cl(spd/44,0,1);
  c.dir=lerp(c.dir, ent.dir*dirMax, 0.26);

  // gira o carro primeiro; a velocidade fica pra trás e é isso que vira deslize
  c.h += c.dir*2.95*cl(spd/5,0,1)*DT*(c.vl<0?-1:1);

  const cs=Math.cos(c.h), sn=Math.sin(c.h);
  let vl= c.vx*cs+c.vz*sn, vt=-c.vx*sn+c.vz*cs;

  const superficie = naPista?1:terra;
  // turbo: força extra ao custo de nitro e de MUITO calor
  c.turbando = 0;
  if(ent.turbo && (c.nitro||0)>0.5 && vl>-1){
    c.nitro = Math.max(0,(c.nitro||0) - NITRO.gasto*DT);
    c.turbando = 1;
  }
  const potMult = c.turbando ? NITRO.forca : 1;
  if(ent.acel>0 || c.turbando) vl += Math.max(ent.acel,c.turbando?0.9:0)*at.potencia*potMult*superficie*DT;
  if(ent.freio)  vl -= (vl>0.5?26:8)*DT;          // segurando parado, engata a ré
  vl -= vl*Math.abs(vl)*at.arrasto*DT;
  vl *= 1-(naPista?0.18:1.7)*DT;
  vl = cl(vl,-11,at.vmax);

  // ADERÊNCIA COM ORÇAMENTO DE DESLIZE.
  // Antes, QUALQUER curva descontava velocidade e o carro parecia freado a
  // cada volante. Agora o pneu tem uma cota de escorregada de graça e só o
  // EXCESSO arranha — que é o que faz curva rápida ser prazerosa e derrapada
  // grande ser cara.
  const freioDeMao = ent.mao ? 0.30 : 1;
  if(c.oleado>0) c.oleado-=DT;
  const ader = at.aderencia*(naPista?1:0.5*terra)*freioDeMao*(c.oleado>0?0.28:1);
  vt *= Math.exp(-ader*DT);
  const excesso = Math.max(0, Math.abs(vt) - ORCAMENTO_DESLIZE);
  vl -= excesso*1.15*DT;
  c.derrapa = Math.abs(vt);                        // o quanto está de lado AGORA

  c.vl=vl;
  c.giroRoda=(c.giroRoda||0) - vl*DT*2.9;      // roda gira com o chão passando
  c.vx=vl*cs-vt*sn; c.vz=vl*sn+vt*cs;
  c.x+=c.vx*DT; c.z+=c.vz*DT;
}

/* ── mapa idle: simulado por tick, recuperável offline ──
   Nada disso depende de aba aberta. Ao entrar no mapa a gente recalcula o
   que aconteceu desde a última visita — que é como o servidor faria. */
function simularIdle(segundos, nivelSensor){
  const r=semente(estado.idleSemente++);
  const porHora=55*(1+nivelSensor*0.03);
  const disputa=0.55+r()*0.25;              // fatia da zona que coube ao seu carro
  const ganho=porHora*(segundos/3600)*disputa*2;
  const antes=estado.energia;
  estado.energia=cl(estado.energia+ganho,0,BATERIA);
  return {ganho:estado.energia-antes, cheia:estado.energia>=BATERIA};
}

/* ══════════════════════════════════════════════════════════════════════════
   GEOMETRIA — construtor de malha e carro paramétrico
   ══════════════════════════════════════════════════════════════════════════ */
class M{
  constructor(){this.p=[];this.n=[];this.c=[];}
  tri(a,b,c,col){const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
    let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;const l=Math.hypot(nx,ny,nz)||1;
    nx/=l;ny/=l;nz/=l;
    for(const v of[a,b,c]){this.p.push(v[0],v[1],v[2]);this.n.push(nx,ny,nz);this.c.push(col[0],col[1],col[2]);}}
  quad(a,b,c,d,col){this.tri(a,b,c,col);this.tri(a,c,d,col);}
  boxR(cx,cy,cz,sx,sy,sz,ang,col){const co=Math.cos(ang),si=Math.sin(ang),hx=sx/2,hy=sy/2,hz=sz/2;
    const P=(a,b,c)=>[cx+a*co-b*si,cy+a*si+b*co,cz+c];
    const v=[P(-hx,-hy,-hz),P(hx,-hy,-hz),P(hx,hy,-hz),P(-hx,hy,-hz),
             P(-hx,-hy,hz),P(hx,-hy,hz),P(hx,hy,hz),P(-hx,hy,hz)];
    this.quad(v[4],v[5],v[6],v[7],col);this.quad(v[1],v[0],v[3],v[2],col);
    this.quad(v[0],v[1],v[5],v[4],col);this.quad(v[3],v[7],v[6],v[2],col);
    this.quad(v[1],v[2],v[6],v[5],col);this.quad(v[0],v[4],v[7],v[3],col);}
  box(cx,cy,cz,sx,sy,sz,col){this.boxR(cx,cy,cz,sx,sy,sz,0,col);}
  cilX(cx,cy,cz,r,len,seg,col){const x0=cx-len/2,x1=cx+len/2;
    for(let i=0;i<seg;i++){const a0=i/seg*6.2832,a1=(i+1)/seg*6.2832;
      const p0=[cy+Math.cos(a0)*r,cz+Math.sin(a0)*r],p1=[cy+Math.cos(a1)*r,cz+Math.sin(a1)*r];
      this.quad([x0,p0[0],p0[1]],[x1,p0[0],p0[1]],[x1,p1[0],p1[1]],[x0,p1[0],p1[1]],col);}}
  cilY(cx,cy,cz,r,len,seg,col){const y0=cy-len/2,y1=cy+len/2;
    for(let i=0;i<seg;i++){const a0=i/seg*6.2832,a1=(i+1)/seg*6.2832;
      const p0=[cx+Math.cos(a0)*r,cz+Math.sin(a0)*r],p1=[cx+Math.cos(a1)*r,cz+Math.sin(a1)*r];
      this.quad([p0[0],y0,p0[1]],[p0[0],y1,p0[1]],[p1[0],y1,p1[1]],[p1[0],y0,p1[1]],col);
      this.tri([cx,y1,cz],[p0[0],y1,p0[1]],[p1[0],y1,p1[1]],col);}}
  cilZ(cx,cy,cz,r,len,seg,col){const z0=cz-len/2,z1=cz+len/2;
    for(let i=0;i<seg;i++){const a0=i/seg*6.2832,a1=(i+1)/seg*6.2832;
      const p0=[cx+Math.cos(a0)*r,cy+Math.sin(a0)*r],p1=[cx+Math.cos(a1)*r,cy+Math.sin(a1)*r];
      this.quad([p0[0],p0[1],z0],[p0[0],p0[1],z1],[p1[0],p1[1],z1],[p1[0],p1[1],z0],col);}
    this.disco(cx,cy,z1,r,seg,col);this.disco(cx,cy,z0,r,seg,col);}
  aro(cx,cy,z0,z1,r,seg,col){for(let i=0;i<seg;i++){const a0=i/seg*6.2832,a1=(i+1)/seg*6.2832;
    const p0=[cx+Math.cos(a0)*r,cy+Math.sin(a0)*r],p1=[cx+Math.cos(a1)*r,cy+Math.sin(a1)*r];
    this.quad([p0[0],p0[1],z0],[p0[0],p0[1],z1],[p1[0],p1[1],z1],[p1[0],p1[1],z0],col);}}
  anel(cx,cy,z,ri,ro,seg,col){for(let i=0;i<seg;i++){const a0=i/seg*6.2832,a1=(i+1)/seg*6.2832;
    const c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1);
    this.quad([cx+c0*ri,cy+s0*ri,z],[cx+c0*ro,cy+s0*ro,z],[cx+c1*ro,cy+s1*ro,z],[cx+c1*ri,cy+s1*ri,z],col);}}
  disco(cx,cy,z,r,seg,col){for(let i=0;i<seg;i++){const a0=i/seg*6.2832,a1=(i+1)/seg*6.2832;
    this.tri([cx,cy,z],[cx+Math.cos(a0)*r,cy+Math.sin(a0)*r,z],[cx+Math.cos(a1)*r,cy+Math.sin(a1)*r,z],col);}}
}

function nrm(P){let a=cl(P.tHood,.10,.50),b=Math.max(a+.05,P.tWs),c=Math.max(b+.05,P.tRoof),
  d=Math.min(Math.max(c+.05,P.tDeck),.95); c=Math.min(c,d-.04);b=Math.min(b,c-.04);a=Math.min(a,b-.04);
  return{a,b,c,d};}
function teto(P,t,S){const nose=Math.max(P.ride+.06,P.hoodH-P.noseDrop),{a,b,c,d}=S;
  if(t<a)return lerp(nose,P.hoodH,suave(t/a));
  if(t<b)return lerp(P.hoodH,Math.max(P.hoodH+.05,P.roofH),suave((t-a)/(b-a)));
  if(t<c)return Math.max(P.hoodH+.05,P.roofH);
  if(t<d)return lerp(Math.max(P.hoodH+.05,P.roofH),P.deckH,suave((t-c)/(d-c)));
  return lerp(P.deckH,P.deckH+(P.ducktail||0),suave((t-d)/(1-d)));}
function meiaLarg(P,t){let s=1;
  s-=P.noseTaper*Math.pow(cl((0.26-t)/0.26,0,1),1.7);
  s-=P.tailTaper*Math.pow(cl((t-0.74)/0.26,0,1),1.7);
  s+=P.flare*gauss(t,P.axF,.075)+P.flare*gauss(t,P.axR,.075);
  return Math.max(.07,(P.width*.5)*s);}

/* Carro: seção de 12 pontos com LINHA DE CINTURA e arco de roda — as duas
   coisas que fazem a malha ler como carro em vez de cunha maciça. */
function construirCarro(P){
  const B=new M(), S=nrm(P), L=P.length;
  const corpo=hex(P.colBody), acc=hex(P.colAcc);
  const vidro=[.020,.030,.042], sob=esc(corpo,.16), grade=[.030,.036,.044];
  const pneu=[.0135,.0145,.0165], fundoAro=[.028,.032,.038], metal=esc(acc,.85), saia=esc(corpo,.42);
  const RF=P.wheelR, RR=P.wheelR*(P.rearRatio||1);
  const arco=t=>{let a=0;for(const[ax,R]of[[P.axF,RF],[P.axR,RR]]){
    const u=Math.abs(t-ax)/((R*1.16)/L); if(u<1)a=Math.max(a,Math.sqrt(1-u*u)*R*1.05);} return a;};

  const N=48, sec=[];
  for(let i=0;i<N;i++){
    const t=i/(N-1), x=L*.5-t*L;
    const yb=Math.max(P.ride-(t<.10?.020*(1-t/.10):0), arco(t));
    const yt=Math.max(yb+.16, teto(P,t,S)), hw=meiaLarg(P,t);
    const yBelt=cl(P.hoodH*.90, yb+.10, yt-.02), gh=Math.max(0,yt-yBelt);
    const ghw=Math.max(.04, hw*(1-P.tumble*cl(gh/.34,0,1))), sh=Math.min(.055,gh*.42);
    const ch=Math.max(.006,Math.min(P.chamfer,hw*.38,ghw*.38,(yBelt-yb)*.40,Math.max(.01,gh-sh)*.55));
    sec.push({x,yb,yt,hw,ghw,yBelt,sh,ch,t,gh});
  }
  const anelS=s=>[[s.x,s.yb,-s.hw*.90+s.ch],[s.x,s.yb+s.ch,-s.hw*.90],[s.x,s.yBelt,-s.hw],
    [s.x,s.yBelt+s.sh,-s.ghw],[s.x,s.yt-s.ch,-s.ghw],[s.x,s.yt,-s.ghw+s.ch],
    [s.x,s.yt,s.ghw-s.ch],[s.x,s.yt-s.ch,s.ghw],[s.x,s.yBelt+s.sh,s.ghw],
    [s.x,s.yBelt,s.hw],[s.x,s.yb+s.ch,s.hw*.90],[s.x,s.yb,s.hw*.90-s.ch]];

  for(let i=0;i<N-1;i++){
    const A=anelS(sec[i]),Bv=anelS(sec[i+1]);
    const tm=(sec[i].t+sec[i+1].t)*.5, gm=(sec[i].gh+sec[i+1].gh)*.5;
    for(let e=0;e<12;e++){const e2=(e+1)%12; let col;
      if(e===11) col=sob;
      else if(e===0||e===10) col=saia;
      else if((e===3||e===7)&&gm>.055) col=vidro;
      else if(e===5&&((tm>S.a&&tm<S.b)||(tm>S.c&&tm<S.d))) col=vidro;
      else col=corpo;
      B.quad(A[e],A[e2],Bv[e2],Bv[e],col);}
  }
  const tampa=(s,col,fl)=>{const r=anelS(s),cy=(s.yb+s.yBelt)/2;
    for(let e=0;e<12;e++){const e2=(e+1)%12;
      fl?B.tri([s.x,cy,0],r[e2],r[e],col):B.tri([s.x,cy,0],r[e],r[e2],col);}};
  tampa(sec[0],grade,false); tampa(sec[N-1],grade,true);

  /* A roda sai do corpo e vira malha própria, em raio 1 e centrada na origem.
     Assada dentro do corpo ela não tinha como girar — e carro com roda parada
     lê como maquete. Aqui ela é desenhada 4 vezes, com giro e esterço. */
  const W=new M(), seg=18, ri=.62, cubo=.16, meia=P.wheelW*.5;
  W.aro(0,0,-meia,meia,1,seg,pneu);
  W.anel(0,0,-meia,ri,1,seg,esc(pneu,1.5));
  W.anel(0,0, meia,ri,1,seg,esc(pneu,1.5));
  W.disco(0,0,meia-.02,ri,seg,fundoAro);
  W.anel(0,0,meia-.035,ri*.87,ri,seg,metal);
  const ns=Math.max(3,Math.round(P.spokes)), raioCor=esc(metal,.78);
  for(let k=0;k<ns;k++){const ang=k/ns*6.2832, rr=ri*.47;
    W.boxR(Math.cos(ang)*rr, Math.sin(ang)*rr, meia-.032, ri*.80, ri*.17,.05,ang,raioCor);}
  W.cilZ(0,0,meia-.03,cubo,.06,10,metal);
  const posRodas=[];
  for(const [t,R,frente] of [[P.axF,RF,true],[P.axR,RR,false]]){
    const x=L*.5-t*L, hw=meiaLarg(P,t);
    for(const sg of [-1,1])
      // lado espelha a malha: o aro e os raios só existem numa face, e sem
      // espelhar a roda esquerda mostrava o lado liso pra fora
      posRodas.push({x, y:R, z:sg*(hw+.022-P.wheelW*.5), r:R, frente, lado:sg});
  }

  const w=P.wing|0;
  if(w>0){const tw=.92,xw=-L*.5+(w===1?.16:.34),hwT=meiaLarg(P,tw),dk=teto(P,tw,S);
    if(w===1) B.boxR(xw,dk+.04,0,.26,.06,hwT*1.80,-0.20,acc);
    else{const h=w===2?.20:.32, span=hwT*2*(w===2?.94:1.02), chord=w===2?.28:.36;
      for(const s of[-1,1]) B.box(xw+.03,dk+h/2,s*span*.32,.075,h,.06,metal);
      B.boxR(xw,dk+h,0,chord,.042,span,-0.19,acc);
      if(w===3) for(const s of[-1,1]) B.box(xw,dk+h+.045,s*span*.5,chord*.95,.13,.032,metal);}}

  const en=P.engine|0;
  if(en>0){const te=Math.min(S.a*.62,.24), xe=L*.5-te*L, ye=teto(P,te,S);
    if(en===1) B.boxR(xe,ye+.055,0,.72,.12,P.width*.34,0.06,esc(corpo,.7));
    if(en===2){B.box(xe,ye+.10,0,.62,.20,P.width*.36,metal);
      for(let k=-1;k<=1;k+=2)for(let j=-1;j<=1;j+=2) B.cilY(xe+k*.17,ye+.28,j*P.width*.11,.055,.20,10,esc(acc,1.1));}
    if(en===3){B.box(xe,ye+.13,0,.66,.26,P.width*.32,esc(metal,.75));
      B.cilZ(xe,ye+.30,0,.13,P.width*.34,12,metal);
      B.box(xe-.05,ye+.44,0,.34,.10,P.width*.26,esc(acc,1.05));}}

  const cano=esc(metal,.62);
  for(const s of[-1,1]) B.cilX(-L*.5+.09,P.ride+.045,s*P.width*.17,.044,.32,10,cano);
  return { corpo:B, roda:W, posRodas, escape:[-L*.5+.02, P.ride+.05, P.width*.17] };
}

/* ── malha da pista: asfalto, meio-fio, grama, linha de largada ── */
function construirPista(pista, nomePiso){
  const B=new M(), PI=PISOS[nomePiso||"asfalto"];
  const asf=PI.pista, mf1=[.30,.045,.035], mf2=[.62,.60,.56], gr=PI.grama;
  const pts=pista.pontos, n=pista.n;
  // chão até onde a névoa alcança: sem isto a grama termina numa parede e
  // aparece o vazio do lado de fora das curvas
  const F=900, ch=esc(PI.grama,0.62);
  B.quad([-F,-.09,-F],[F,-.09,-F],[F,-.09,F],[-F,-.09,F],ch);
  for(let i=0;i<n;i++){
    const p=pts[i], q=pts[(i+1)%n];
    const L=(o,w)=>[o.x+o.nx*w, .02, o.z+o.nz*w];
    B.quad(L(p,-p.larg/2),L(q,-q.larg/2),L(q,q.larg/2),L(p,p.larg/2),asf);
    // meio-fio zebrado dos dois lados
    const cor=(i%6<3)?mf1:mf2;
    for(const s of[-1,1]){
      const a=L(p,s*p.larg/2), b=L(q,s*q.larg/2);
      const a2=L(p,s*(p.larg/2+1.5)), b2=L(q,s*(q.larg/2+1.5));
      a[1]=b[1]=.03; a2[1]=b2[1]=.10;
      B.quad(a,b,b2,a2,cor);
    }
    // faixa de grama larga só para o olho ter referência de velocidade
    for(const s of[-1,1]){
      const a=L(p,s*(p.larg/2+1.5)), b=L(q,s*(q.larg/2+1.5));
      const a2=L(p,s*(p.larg/2+70)), b2=L(q,s*(q.larg/2+70));
      a[1]=b[1]=.10; a2[1]=b2[1]=-.07;
      B.quad(a,b,b2,a2, (i%2? gr : esc(gr,1.35)));
    }
  }
  const p0=pts[0], br=[.80,.80,.78];
  for(let k=-3;k<=3;k++){
    const w=k*1.4;
    B.box(p0.x+p0.nx*w, .045, p0.z+p0.nz*w, 1.2, .01, 1.2, (k%2?br:[.05,.05,.05]));
  }
  return B;
}

function prog(vs,fs){const c=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;};
  const p=gl.createProgram();gl.attachShader(p,c(gl.VERTEX_SHADER,vs));gl.attachShader(p,c(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  return p;}
const TONE=`vec3 aces(vec3 x){const float a=2.51,b=.03,c=2.43,d=.59,e=.14;
  return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.,1.);} vec3 saida(vec3 c){return pow(aces(c),vec3(1./2.2));}`;

const pObj=prog(`#version 300 es
layout(location=0)in vec3 aP;layout(location=1)in vec3 aN;layout(location=2)in vec3 aC;
uniform mat4 uP,uV,uM;out vec3 vN,vW,vC;
void main(){vec4 w=uM*vec4(aP,1.);vW=w.xyz;vN=mat3(uM)*aN;vC=aC;gl_Position=uP*uV*w;}`,
`#version 300 es
precision highp float;in vec3 vN,vW,vC;uniform vec3 uEye;uniform float uNeb;uniform vec3 uTinta;out vec4 o;
${TONE}
void main(){
  vec3 N=normalize(vN); if(!gl_FrontFacing)N=-N;
  vec3 V=normalize(uEye-vW);
  vec3 K=normalize(vec3(.55,.80,.30)),F1=normalize(vec3(-.70,.34,-.50)),F2=normalize(vec3(.10,.16,-.98));
  vec3 amb=mix(vec3(.105,.118,.140),vec3(.36,.405,.465),N.y*.5+.5);
  vec3 c=vC*uTinta*(amb+vec3(1.22,1.10,.90)*max(dot(N,K),0.)
        +vec3(.22,.32,.46)*max(dot(N,F1),0.)+vec3(.17,.20,.27)*max(dot(N,F2),0.));
  c+=vec3(1.,.92,.78)*pow(max(dot(N,normalize(K+V)),0.),64.)*.15;
  c+=vec3(.42,.58,.82)*pow(1.-max(dot(N,V),0.),3.4)*.22;
  float d=length(uEye-vW);
  c=mix(c, vec3(.030,.042,.056), clamp((d-70.)/uNeb,0.,.82));
  o=vec4(saida(c),1.);}`);

const pFundo=prog(`#version 300 es
out vec2 vU;void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);vU=p;gl_Position=vec4(p*2.-1.,0.,1.);}`,
`#version 300 es
precision highp float;in vec2 vU;uniform float uLuz;out vec4 o;${TONE}
void main(){vec3 c=mix(vec3(.008,.012,.018),vec3(.072,.090,.112),pow(vU.y,1.3));
  c+=vec3(.055,.048,.030)*smoothstep(.75,.05,distance(vU,vec2(.5,.60)));
  c*=uLuz; o=vec4(saida(c),1.);}`);

const vazio=gl.createVertexArray();
function subir(mesh){
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const dados=[new Float32Array(mesh.p),new Float32Array(mesh.n),new Float32Array(mesh.c)];
  dados.forEach((a,i)=>{const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,a,gl.STATIC_DRAW);gl.enableVertexAttribArray(i);
    gl.vertexAttribPointer(i,3,gl.FLOAT,false,0,0);});
  gl.bindVertexArray(null);
  return {vao, n:mesh.p.length/3};
}
const m4p=(fy,as,n,f)=>{const t=1/Math.tan(fy/2);
  return new Float32Array([t/as,0,0,0,0,t,0,0,0,0,(f+n)/(n-f),-1,0,0,2*f*n/(n-f),0]);};
function m4look(e,c,u){let z=[e[0]-c[0],e[1]-c[1],e[2]-c[2]];let l=Math.hypot(...z)||1;z=z.map(v=>v/l);
  let x=[u[1]*z[2]-u[2]*z[1],u[2]*z[0]-u[0]*z[2],u[0]*z[1]-u[1]*z[0]];l=Math.hypot(...x)||1;x=x.map(v=>v/l);
  const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];
  return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,
    -(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]),-(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]),-(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]),1]);}
function m4pose(x,y,z,ang,esc=1){const c=Math.cos(ang)*esc,s=Math.sin(ang)*esc;
  return new Float32Array([c,0,-s,0, 0,esc,0,0, s,0,c,0, x,y,z,1]);}

const som={ctx:null,on:false,osc:[],ganho:null,ruido:null};
function ligarSom(){
  if(som.ctx)return;
  som.ctx=new (window.AudioContext||window.webkitAudioContext)();
  const g=som.ctx.createGain(); g.gain.value=0; g.connect(som.ctx.destination);
  som.ganho=g;
  for(const[tipo,det,vol] of [["sawtooth",0,.22],["square",-.02,.11],["sawtooth",.013,.09]]){
    const o=som.ctx.createOscillator(), gg=som.ctx.createGain();
    o.type=tipo; gg.gain.value=vol; o.connect(gg); gg.connect(g); o.start();
    som.osc.push({o,det});
  }
  const f=som.ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=1400;
}
function motorSom(rpm,carga){
  if(!som.on||!som.ctx)return;
  const base=52+rpm*118;
  for(const{o,det} of som.osc) o.frequency.setTargetAtTime(base*(1+det),som.ctx.currentTime,.03);
  som.ganho.gain.setTargetAtTime(0.035+carga*0.075,som.ctx.currentTime,.05);
}

/* ── toque ──────────────────────────────────────────────────────────────
   Um manche para guiar e dois botões de ação. O acelerador é AUTOMÁTICO:
   com quatro botões de pressionar era preciso uma terceira mão. */
const ehToque = ("ontouchstart" in window) || navigator.maxTouchPoints>0;
const manche = { dir:0, freio:false, id:null, cx:0, cy:0, r:56 };
(function(){
  const el=document.getElementById("manche"), bola=document.getElementById("mancheBola");
  const solta=()=>{ manche.dir=0; manche.freio=false; manche.id=null;
    el.classList.remove("puxado"); bola.style.transform="translate(0,0)"; };
  el.addEventListener("pointerdown",e=>{
    e.preventDefault(); manche.id=e.pointerId; el.setPointerCapture(e.pointerId);
    const r=el.getBoundingClientRect(); manche.cx=r.left+r.width/2; manche.cy=r.top+r.height/2;
    manche.r=r.width*0.42; el.classList.add("puxado"); mover(e);
    ligarSomSeMudo();
  });
  el.addEventListener("pointermove",e=>{ if(manche.id===e.pointerId){e.preventDefault(); mover(e);} });
  el.addEventListener("pointerup",e=>{ if(manche.id===e.pointerId) solta(); });
  el.addEventListener("pointercancel",solta);
  function mover(e){
    let dx=e.clientX-manche.cx, dy=e.clientY-manche.cy;
    const d=Math.hypot(dx,dy), lim=manche.r;
    if(d>lim){ dx*=lim/d; dy*=lim/d; }
    bola.style.transform="translate("+dx.toFixed(0)+"px,"+dy.toFixed(0)+"px)";
    manche.dir=cl(dx/lim,-1,1);
    manche.freio=dy>lim*0.55;      // puxar pra trás freia e dá ré
  }
})();

  const eixo=g.axes[0]||0;

  const gat=(i)=>g.buttons[i]&&(g.buttons[i].pressed||g.buttons[i].value>0.3);
  teclas.arrowup   = gat(7)||gat(0);      // RT ou A
  teclas.arrowdown = gat(6)||gat(1);      // LT ou B
  teclas[" "]      = gat(2);              // X — freio de mão

  teclas.e         = gat(4);              // LB — item
}

function fogoTurbo(m,p){

  for(const lado of [-1,1]){
    const lx=ex, lz=ez*lado;
    const wx=p.x + lx*cs + lz*sn;
    const wz=p.z - lx*sn + lz*cs;
    const e=new Float32Array([cs*tremida,0,-sn*tremida, 0, 0,tremida,0,0,
                              sn*tremida,0,cs*tremida, 0, wx,ey,wz,1]);

/* ── matrizes ── */
function m4mul(a,b){const o=new Float32Array(16);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++)
    o[i*4+j]=a[j]*b[i*4]+a[4+j]*b[i*4+1]+a[8+j]*b[i*4+2]+a[12+j]*b[i*4+3];
  return o;}
function m4rodaLocal(w,giro,esterco){
  const cz=Math.cos(giro), sz=Math.sin(giro);
  const cy=Math.cos(esterco), sy=Math.sin(esterco);
  // escala (r,r,1) · giro em Z · esterço em Y · translação
  const r=w.r;
  const e=w.lado||1;   // -1 espelha a face decorada para o lado de fora
  const a=new Float32Array([ cz*r,sz*r,0,0,  -sz*r,cz*r,0,0,  0,0,e,0,  0,0,0,1]);
  const b=new Float32Array([ cy,0,-sy,0,  0,1,0,0,  sy,0,cy,0,  w.x,w.y,w.z,1]);
  return m4mul(b,a);
}
function desenharCarro(m,pose,giro,esterco){
  desenhar(m.corpo,pose);
  for(const w of m.posRodas)
    desenhar(m.roda, m4mul(pose, m4rodaLocal(w,giro,w.frente?esterco:0)));
}
function reconstruirPista(){ malhaPista=subir(construirPista(pista, estado.piso)); }
function construirChao(){
  const B=new M(), a=[.028,.034,.040], b=[.020,.025,.030];
  const L=300, P=13;
  for(let i=-P;i<P;i++) for(let j=-P;j<P;j++){
    const x0=i*L/P*1.6, z0=j*L/P*1.6, w=L/P*1.6;
    B.quad([x0,-.02,z0],[x0+w,-.02,z0],[x0+w,-.02,z0+w],[x0,-.02,z0+w], (i+j)%2?a:b);
  }
  malhaChao=subir(B);
}
function construirChama(){
  const B=new M(), q=[4.0,1.1,.18], a=[4.4,2.8,1.4];
  // cone apontando pra trás, com um miolo mais claro
  const r=.20, L=1.15;
  for(let i=0;i<7;i++){
    const a0=i/7*6.2832, a1=(i+1)/7*6.2832;
    B.tri([-L,0,0],[0,Math.sin(a0)*r,Math.cos(a0)*r],[0,Math.sin(a1)*r,Math.cos(a1)*r],q);
    B.tri([-L*.45,0,0],[0,Math.sin(a1)*r*.5,Math.cos(a1)*r*.5],[0,Math.sin(a0)*r*.5,Math.cos(a0)*r*.5],a);
  }
  malhaChama=subir(B);
}
function construirAnel(){

}
function construirCaixa(){
  const B=new M(), a=[1,1,1], b=[.55,.55,.55];
  // octaedro: gira bonito e lê de longe
  const r=1.5, h=1.9;
  for(let i=0;i<4;i++){
    const a0=i/4*6.2832+0.785, a1=(i+1)/4*6.2832+0.785;
    const p0=[Math.cos(a0)*r,0,Math.sin(a0)*r], p1=[Math.cos(a1)*r,0,Math.sin(a1)*r];
    B.tri([0,h,0],p0,p1,a); B.tri([0,-h*0.6,0],p1,p0,b);
  }
  malhaCaixa=subir(B);
}
function construirMancha(){

function construirSeta(){
  const B=new M(), am=[2.4,1.35,.30];
  // anel no chão em volta do carro: de cima, isto lê na hora; um cone vira
  // um pentágono chapado e não ajuda ninguém
  B.anel(0,0,0,5.4,6.6,26,am);
  for(let k=0;k<3;k++){                       // três marcas maiores no anel
    const a=k/3*6.2832;
    B.boxR(Math.cos(a)*6.9,Math.sin(a)*6.9,0,2.0,.9,.01,a,am);
  }

}
function construirPoco(){
  const B=new M(), am=[1.6,.95,.22];
  B.cilY(0,1.1,0,.55,2.2,7,am);
  B.disco(0,2.2,0,.55,7,esc(am,1.4));
  B.box(0,.12,0,2.6,.24,2.6,[.12,.10,.05]);
  malhaPoco=subir(B);
}

/* ══════════════════════════════════════════════════════════════════════════
   CORRIDA
   ══════════════════════════════════════════════════════════════════════════ */
const VOLTAS=2;
function novoPiloto(i){
  const p=pista.pontos[0];
  const off=(i-1.5)*3.4;
  const r=semente(1000+i*37+Math.floor(Math.random()*9999));
  return {x:p.x+p.nx*off, z:p.z+p.nz*off, h:Math.atan2(p.tz,p.tx),
          vx:0,vz:0,vl:0,dir:0,derrapa:0,
          nitro:0, item:null, itemDesde:0, oleado:0, travado:0, turbando:0,
          seg:0, volta:0, prog:0, terminou:-1, ia:i>0,
          // PERSONALIDADE: sem isto os rivais andam em fila indiana feito trenzinho
          perfil:{
            linha:   (r()*2-1)*0.62,      // quanto puxa pra dentro ou pra fora
            coragem: 0.92+r()*0.12,       // leque estreito: diferença grande de ritmo mata a disputa
            forca:   0.93+r()*0.11,       // potência relativa
            erro:    0.04+r()*0.14,       // amplitude do erro de volante
            ritmo:   0.5+r()*1.4,         // frequência do erro
            fase:    r()*6.28,
          }};
}
function montarCaixas(){
  const cx=[];
  // Caixa rara e fora da linha de corrida quase nunca é pega: 27 caixas
  // renderam 6 itens numa prova inteira. Mais fileiras, mais larguras.
  for(let i=8;i<pista.n;i+=13){
    const p=pista.pontos[i];
    for(const lado of [-0.50,-0.25,0,0.25,0.50])
      cx.push({x:p.x+p.nx*p.larg*lado*0.80, z:p.z+p.nz*p.larg*lado*0.80, volta:0});
  }
  return cx;
}
function iniciarCorrida(){
  const at=atributos();
  corrida={
    pilotos:[novoPiloto(0),novoPiloto(1),novoPiloto(2),novoPiloto(3)],
    at, t:-3.2, tVolta:0, melhor:-1, acabou:false, perLog:[], marcas:[],
    periciaGanha:0, pico:0, caixas:montarCaixas(), perigos:[], efeitos:[], estouroVindo:null, aviso:"", avisoAte:0,
  };
  corrida.pilotos[0].ia=false;
  document.getElementById("hud").classList.add("on");
  document.getElementById("modal").classList.remove("on");
}
function iaEntrada(p, at, t, rivais){
  const n=pista.n, spd=Math.hypot(p.vx,p.vz), P=p.perfil;
  const look=Math.round(4+spd*0.20);
  const norm=a=>{while(a>Math.PI)a-=6.2832; while(a<-Math.PI)a+=6.2832; return a;};
  const aqui=pista.pontos[p.seg];

  // linha preferida: cada um corre num traçado diferente, não em fila
  const alvoIdx=(p.seg+look)%n, ap=pista.pontos[alvoIdx];
  let desvio=P.linha*ap.larg*0.34;

  // desviar de quem está na frente — é isto que gera ultrapassagem
  for(const o of rivais){
    if(o===p||o.terminou>=0) continue;
    const dx=o.x-p.x, dz=o.z-p.z, d=Math.hypot(dx,dz);
    if(d>16||d<0.1) continue;
    const aFrente=(dx*Math.cos(p.h)+dz*Math.sin(p.h))/d;
    if(aFrente<0.55) continue;                       // só quem está mesmo à frente
    const ladoDele=(o.x-aqui.x)*aqui.nx+(o.z-aqui.z)*aqui.nz;
    desvio += (ladoDele>0?-1:1)*(16-d)*0.42*P.coragem;
  }
  desvio=cl(desvio,-ap.larg*0.44,ap.larg*0.44);

  const ax=ap.x+ap.nx*desvio, az=ap.z+ap.nz*desvio;
  const ang=norm(Math.atan2(az-p.z,ax-p.x)-p.h);

  /* CORREÇÃO LATERAL COM AMORTECIMENTO (PD).
     Só com o termo de posição a IA oscilava de um lado ao outro da pista até
     ser cuspida pra fora — instabilidade clássica de malha de controle: ganho
     alto, resposta atrasada, nenhum amortecimento. O termo derivativo é a
     velocidade lateral em relação à pista, que dá pra ler direto do vetor
     velocidade sem guardar histórico. */
  const lat=(p.x-aqui.x)*aqui.nx+(p.z-aqui.z)*aqui.nz;
  const vLatPista=p.vx*aqui.nx+p.vz*aqui.nz;
  const correcao=-cl((lat-desvio)*0.055 + vLatPista*0.17, -0.75, 0.75);

  /* VELOCIDADE-ALVO PELA CURVATURA REAL DA PISTA.
     Antes ela media o ângulo até um ponto a `look*2` de distância — a 40 m/s
     isso dava 255 m à frente, numa pista que tem curva a cada 111 m. Sempre
     havia curva no horizonte dela, então a velocidade-alvo nunca subia e ela
     nunca acelerava de verdade. Era isso que fazia os rivais parecerem
     passageiros em vez de adversários.

     Agora mede a curvatura entre as TANGENTES da própria pista, numa janela
     do tamanho da distância de frenagem, e resolve v = raiz(aderência/κ) —
     que é a velocidade que a curva de fato aguenta. */
  const esp=pista.comprimento/n, FREIO=24;
  // Varre TODOS os pontos dentro da distância de frenagem: para cada um,
  // calcula a velocidade que aquela curva aguenta e, de trás pra frente,
  // qual velocidade eu posso ter AGORA e ainda chegar lá freando a tempo.
  // É por isso que ela passa a acelerar na reta e frear cedo pra curva.
  let vCurva=at.vmax;
  const alcance=Math.max(6, Math.round((spd*spd/(2*FREIO)+22)/esp));
  for(let d=2; d<=alcance; d+=2){
    const a=pista.pontos[(p.seg+d)%n], b=pista.pontos[(p.seg+d+3)%n];
    const kap=Math.abs(norm(Math.atan2(b.tz,b.tx)-Math.atan2(a.tz,a.tx)))/(3*esp);
    const vLa=Math.sqrt((at.aderencia*1.70)/Math.max(1e-5,kap));
    vCurva=Math.min(vCurva, Math.sqrt(vLa*vLa + 2*FREIO*d*esp));
  }

  // VONTADE DE GANHAR: quem está atrás do líder anda um pouco mais no limite.
  // Sem isto o pelotão se esparrama e ninguém volta pra briga.
  const lider=Math.max(...rivais.map(o=>o.prog||0));
  const atraso=cl(((lider-(p.prog||0))/n)*1.9,0,0.17);

  const vAlvo=Math.min(at.vmax, vCurva)*P.coragem*(1+atraso);

  // erro humano: mão que treme e às vezes entra torto
  const tremor=Math.sin(t*P.ritmo+P.fase)*P.erro;
  const curvaAgora=Math.abs(norm(Math.atan2(
    pista.pontos[(p.seg+5)%n].z-p.z, pista.pontos[(p.seg+5)%n].x-p.x)-p.h));

  return {dir:cl(ang*1.45+correcao+tremor,-1,1),
          acel: spd<vAlvo ? 1 : 0.08,
          freio: spd>vAlvo*1.10,
          mao: curvaAgora>0.85&&spd>vAlvo*1.3,
          turbo: (p.nitro||0)>28 && spd>vAlvo*0.80 && curvaAgora<0.45};
}
function passoCorrida(){
  const c=corrida; if(!c)return;
  c.t+=DT;
  for(let i=0;i<c.pilotos.length;i++){
    const p=c.pilotos[i];
    if(p.terminou>=0){ p.vx*=.98; p.vz*=.98; p.x+=p.vx*DT; p.z+=p.vz*DT; continue; }
    const np=maisProximo(pista,p.x,p.z,p.seg);
    // detecta a volta pelo cruzamento do índice 0 no sentido certo
    if(p.seg>pista.n-12 && np.i<12){ p.volta++;
      if(!p.ia){ const v=c.tVolta; c.tVolta=0;
        if(v>1 && (c.melhor<0||v<c.melhor)){ c.melhor=v; if(estado.melhorVolta<0||v<estado.melhorVolta) estado.melhorVolta=v; }
        if(p.volta>=VOLTAS){ p.terminou=c.t; terminarCorrida(); } }
      else if(p.volta>=VOLTAS) p.terminou=c.t;
    }
    p.seg=np.i;
    const naPista=np.dist < pista.pontos[np.i].larg/2 + 0.6;
    // A largada vale pra todo mundo. Antes o gate de contagem regressiva só
    // existia no ramo do jogador e as IAs saíam 3,2 s na frente.
    const ent = c.t<0 ? {dir:0,acel:0,freio:false,mao:false}
      : p.ia ? iaEntrada(p,c.at,c.t,c.pilotos)
      : (ehToque
         ? { dir:manche.dir,
             acel:manche.freio?0:1,          // acelerador automático
             freio:manche.freio,
             mao:!!teclas[" "],
             turbo:!!teclas.shift }
         : { dir:(teclas.arrowleft||teclas.a?-1:0)+(teclas.arrowright||teclas.d?1:0),
             acel:(teclas.arrowup||teclas.w)?1:0,
             freio:!!(teclas.arrowdown||teclas.s),
             mao:!!teclas[" "],
             turbo:!!teclas.shift });
    const at = p.ia ? {...c.at, potencia:c.at.potencia*p.perfil.forca,
                       aderencia:c.at.aderencia*(0.94+p.perfil.coragem*0.06)} : c.at;
    passo(p, ent, at, naPista, c.at.terra);
    p.prog=p.volta*pista.n+np.i;

    if(!p.ia){
      if(c.t>=0) c.tVolta+=DT;
      c.pico=Math.max(c.pico,Math.hypot(p.vx,p.vz));
      // Perícia: derrapagem controlada dentro da pista. Só mão humana consegue.
      if(p.derrapa>ORCAMENTO_DESLIZE && naPista && Math.hypot(p.vx,p.vz)>14){
        c.periciaGanha+=(p.derrapa-ORCAMENTO_DESLIZE)*DT*1.4;
      }
      // fora do asfalto o carro solta muito mais rastro: é o aviso visual de
      // que o piso mudou, sem precisar ler nada
      const lim = estado.piso==="asfalto" ? ORCAMENTO_DESLIZE*0.7 : ORCAMENTO_DESLIZE*0.32;
      if(p.derrapa>lim && naPista && c.marcas.length<900 &&
         Math.random()<(estado.piso==="asfalto"?.5:.85))
        c.marcas.push({x:p.x,z:p.z,h:p.h,v:1});
    }
  }
  /* ── nitro, caixas de item e perigos ── */
  const eu0=c.pilotos[0];
  const ordem=[...c.pilotos].sort((a,b)=>b.prog-a.prog);
  for(const p of c.pilotos){
    if(p.terminou>=0) continue;
    const spd=Math.hypot(p.vx,p.vz);

    // enche nitro derrapando dentro da pista...
    const excesso=Math.max(0,(p.derrapa||0)-ORCAMENTO_DESLIZE);
    let ganho=excesso*NITRO.porDeslize;
    // ...e pegando vácuo de quem está logo à frente
    for(const o of c.pilotos){
      if(o===p||o.terminou>=0) continue;
      const dx=o.x-p.x, dz=o.z-p.z, d=Math.hypot(dx,dz);
      if(d>34||d<2) continue;
      const alinhado=(dx*Math.cos(p.h)+dz*Math.sin(p.h))/d;
      if(alinhado>0.72 && spd>12){ ganho+=NITRO.porVacuo*(1-d/34); break; }
    }
    // quem está atrás ganha nitro só por estar atrás: é o elástico que
    // devolve o perseguidor pra briga quando o vácuo já não alcança
    const lider=Math.max(...c.pilotos.map(o=>o.prog||0));
    ganho += NITRO.porAtraso*cl(((lider-(p.prog||0))/pista.n)*1.7,0,1);
    p.nitro=cl((p.nitro||0)+ganho*DT,0,NITRO.max);

    if(p.travado>0) p.travado-=DT;

    // caixa de item
    if(!p.item){
      for(const cx of c.caixas){
        if(cx.volta>0) continue;
        if(Math.hypot(cx.x-p.x,cx.z-p.z)<5.4){
          cx.volta=11;
          p.item=sortearItem(ordem.indexOf(p)+1); p.itemDesde=c.t;
          if(!p.ia){ c.aviso="PEGOU "+ITENS[p.item].nome.toUpperCase()+" — TECLA E"; c.avisoAte=c.t+2.4; }
          break;
        }
      }
    }

    // perigo no chão
    for(const g of c.perigos){
      if(g.de===p&&c.t-g.t<1.2) continue;
      if(Math.hypot(g.x-p.x,g.z-p.z)<3.4 && p.oleado<=0){ p.oleado=1.5; }
    }
  }
  for(const cx of c.caixas) if(cx.volta>0) cx.volta-=DT;
  c.perigos=c.perigos.filter(g=>c.t-g.t<14);
  c.efeitos=c.efeitos.filter(e=>c.t-e.t<0.75);

  /* ── contato entre carros ──
     Sem isto eles se atravessam e a corrida perde a disputa corpo a corpo,
     que é metade da graça de correr contra alguém. Separação por círculo,
     com troca de quantidade de movimento ao longo da normal do contato. */
  const RAIO=2.95;
  for(let i=0;i<c.pilotos.length;i++) for(let j=i+1;j<c.pilotos.length;j++){
    const a=c.pilotos[i], b=c.pilotos[j];
    const dx=b.x-a.x, dz=b.z-a.z, d=Math.hypot(dx,dz);
    if(d>=RAIO||d<1e-4) continue;
    const nx=dx/d, nz=dz/d, empurra=(RAIO-d)*0.5;
    a.x-=nx*empurra; a.z-=nz*empurra; b.x+=nx*empurra; b.z+=nz*empurra;
    const va=a.vx*nx+a.vz*nz, vb=b.vx*nx+b.vz*nz;
    if(va-vb>0){
      const t=(va-vb)*0.6;
      a.vx-=nx*t; a.vz-=nz*t; b.vx+=nx*t; b.vz+=nz*t;
      if(!a.ia||!b.ia) c.batidas=(c.batidas||0)+1;
    }
  }

  for(const m of c.marcas) m.v-=DT*0.09;

  /* ── estouro a caminho: resolve ou é defendido ── */
  if(c.estouroVindo && c.t>=c.estouroVindo.em){
    const a=c.estouroVindo.alvo;
    if(a.terminou<0){
      a.travado=1.5; a.vx*=0.44; a.vz*=0.44; a.oleado=1.2; efeito(c,a,"estouro");
      c.aviso = a.ia ? "ESTOURO ACERTOU O LÍDER" : "VOCÊ FOI ESTOURADO";
      c.avisoAte=c.t+2.0;
    }
    c.estouroVindo=null;
  }

  /* ── uso de item ── */
  for(const p of c.pilotos){
    if(!p.item||p.terminou>=0) continue;
    // DEFESA: quem está na mira gasta o item que tiver e escapa
    if(c.estouroVindo && c.estouroVindo.alvo===p){
      const defende = p.ia ? true : (!!teclas.e||!!teclas.control);
      if(defende){
        c.estouroVindo=null; p.item=null; efeito(c,p,"reparo");
        c.aviso = p.ia ? "O LÍDER DEFENDEU" : "VOCÊ DEFENDEU O ESTOURO";
        c.avisoAte=c.t+2.0;
        continue;
      }
    }
    let usar=false;
    if(p.ia){
      // a IA decide quando vale: turbo em reta, óleo com alguém colado atrás,
      // tranco em quem está logo à frente, reparo quando o carro está ruim
      const spd=Math.hypot(p.vx,p.vz);
      if(p.item==="turbo")  usar = spd>c.at.vmax*0.45 && (p.nitro||0)<40;
      if(p.item==="oleo")   usar = c.pilotos.some(o=>o!==p&&o.terminou<0&&
                              Math.hypot(o.x-p.x,o.z-p.z)<22&&
                              ((o.x-p.x)*Math.cos(p.h)+(o.z-p.z)*Math.sin(p.h))<0);
      if(p.item==="tranco") usar = c.pilotos.some(o=>o!==p&&o.terminou<0&&
                              Math.hypot(o.x-p.x,o.z-p.z)<34&&
                              ((o.x-p.x)*Math.cos(p.h)+(o.z-p.z)*Math.sin(p.h))>0);
      if(p.item==="reparo") usar = (p.nitro||0)<45;
      if(p.item==="estouro")usar = true;
      // Sem prazo, o carro segurava óleo ou reparo pra sempre esperando a
      // condição perfeita — e enquanto segura NÃO PEGA MAIS NADA. Era isso
      // que fazia 3º e 4º quase não receberem item, justo quem mais precisa.
      if(!usar && c.t-(p.itemDesde||0) > 12) usar = true;
    } else usar = !!teclas.e || !!teclas.control;
    if(!usar) continue;

    if(p.item==="estouro"){
      let alvo=null, melhor=-1;
      for(const o of c.pilotos){ if(o===p||o.terminou>=0) continue;
        if(o.prog>melhor){ melhor=o.prog; alvo=o; } }
      if(alvo && alvo.prog>p.prog && !c.estouroVindo){
        /* Alcance infinito é o que faz o item existir — limitar distância o
           tornaria inútil justo quando é necessário. O que faltava não era
           limite, era RESPOSTA: acertar do nada, sem o alvo poder fazer nada,
           é o que torna o casco azul o item mais odiado dos jogos.
           Agora vem com aviso e janela de defesa. */
        c.estouroVindo={ alvo, em:c.t+1.6, de:p };
        c.aviso = alvo.ia ? "ESTOURO A CAMINHO DO LÍDER" : "ESTOURO VINDO — USE UM ITEM PARA DEFENDER";
        c.avisoAte=c.t+1.6;
      } else if(!p.ia) continue;
    }
    if(p.item==="turbo"){ p.nitro=NITRO.max; efeito(c,p,"turbo"); }
    if(p.item==="oleo"){  c.perigos.push({x:p.x-Math.cos(p.h)*4,z:p.z-Math.sin(p.h)*4,t:c.t,de:p});
                          efeito(c,{x:p.x-Math.cos(p.h)*4,z:p.z-Math.sin(p.h)*4},"oleo"); }
    if(p.item==="reparo"){ p.nitro=cl((p.nitro||0)+55,0,NITRO.max); efeito(c,p,"reparo"); }
    if(p.item==="tranco"){
      let alvo=null, melhor=1e9;
      for(const o of c.pilotos){
        if(o===p||o.terminou>=0) continue;
        const dx=o.x-p.x, dz=o.z-p.z, d=Math.hypot(dx,dz);
        if(d>40) continue;
        if(((dx*Math.cos(p.h)+dz*Math.sin(p.h))/d)<0.5) continue;
        if(d<melhor){ melhor=d; alvo=o; }
      }
      if(alvo){ alvo.travado=1.1; alvo.vx*=0.55; alvo.vz*=0.55; efeito(c,alvo,"tranco");
        if(!alvo.ia){ c.aviso="VOCÊ LEVOU UM TRANCO"; c.avisoAte=c.t+1.8; }
        else if(!p.ia){ c.aviso="TRANCO ACERTOU"; c.avisoAte=c.t+1.6; } }
      else if(!p.ia) continue;   // jogador só gasta se tiver alvo
    }
    p.item=null;
  }

  // efeito do tranco: freia forte por um instante
  for(const p of c.pilotos) if(p.travado>0){ p.vx*=1-1.4*DT; p.vz*=1-1.4*DT; }
  c.marcas=c.marcas.filter(m=>m.v>0);
}
function terminarCorrida(){
  const c=corrida; if(c.acabou)return; c.acabou=true;
  const eu=c.pilotos[0];
  const pos=1+c.pilotos.filter(p=>p!==eu && (p.terminou>=0&&p.terminou<eu.terminou)).length;
  const per=Math.round(c.periciaGanha), suc=Math.round(52+Math.max(0,4-pos)*22+per*0.8);
  estado.pericia+=per; estado.sucata+=suc; estado.corridas++;
  if(pos===1) estado.vitorias=(estado.vitorias||0)+1;
  for(const k of ["chassi","motor","rodas","aero"])
    estado.dur[k]=cl((estado.dur[k]||100) - (7+Math.random()*5), 0, 100);
  sortearProxima();
  salvar();
  document.getElementById("hud").classList.remove("on");
  abrirModal(`
    <h2>${pos===1?icone("trofeu",44)+" Vitória":pos+"º lugar"}</h2>
    <div class="sub">${VOLTAS} voltas · ${["","primeiro","segundo","terceiro","quarto"][pos]} de 4</div>
    <div class="linha"><span>Melhor volta</span><b>${tempo(c.melhor)}</b></div>
    <div class="linha"><span>Velocidade de pico</span><b>${Math.round(c.pico*3.6)} km/h</b></div>
    <div class="linha d"><span>Perícia ganha</span><b>+${per}</b></div>
    <div class="linha d"><span>Sucata</span><b>+${suc}</b></div>
    <div class="acoes">
      <button class="btn p" id="mDeNovo">Correr de novo</button>
      <button class="btn" id="mGaragem">Garagem</button>
    </div>`);
  document.getElementById("mDeNovo").onclick=()=>{ if(gastarEnergia()) iniciarCorrida(); };
  document.getElementById("mGaragem").onclick=()=>irPara("garagem");
}

/* ══════════════════════════════════════════════════════════════════════════
   MAPA IDLE
   ══════════════════════════════════════════════════════════════════════════ */
/* A zona faz surgir carga a uma taxa FIXA — essa é a torneira, e ela não muda
   com quantos carros estão no mapa. O que muda é quanto sobra pra você: quem
   chega primeiro leva. É a mesma lei de antes, mas disputada em movimento em
   vez de dividida parado.

   O desenho anterior deixava os carros orbitando em cima do poço feito
   beyblade: sem disputa visível, sem decisão, sem vida. */
/* Meia carga a cada 0,45 s vale a mesma energia por segundo que uma inteira a
   cada 1,1 s — mas mantém MAIS carga em campo do que carro, que é a condição
   para cada um perseguir a sua em vez de todos correrem pro mesmo ponto.

   O ritmo aqui é ~53x o da Fase 1 porque o mapa roda em TEMPO ACELERADO: um
   minuto olhando é uma hora de jogo. 8 h de bateria = 8 min de tela = 4,8
   corridas, que bate com o modelo econômico. */
const ZONA={ raio:190, intervalo:0.45, valor:10, maxCargas:34, aceleracao:60 };

function surgirCarga(m,r){
  const rr=r||Math.random;
  const a=rr()*6.2832, d=Math.sqrt(rr())*ZONA.raio;
  m.cargas.push({x:Math.cos(a)*d, z:Math.sin(a)*d, nasceu:m.t});
}

function iniciarMapa(){
  const r=semente(91), carros=[];
  for(let i=0;i<12;i++) carros.push({
    x:(r()-.5)*330, z:(r()-.5)*330, h:r()*6.2832,
    vel:16+r()*10, giro:1.5+r()*1.0, meu:i===0, coletou:0, alvo:-1,
  });
  carros[0].vel=21; carros[0].giro=2.3;      // o seu carro é o melhor do mapa
  mapa={cargas:[], carros, t:0, proxima:0, minhas:0, total:0, zoom:1, cam:null, brilho:0};
  for(let i=0;i<26;i++) surgirCarga(mapa,r);

  // recupera o que rendeu desde a última visita: nada disso precisa de aba aberta
  const seg=Math.min(8*3600,(Date.now()-estado.idleUltimo)/1000);
  estado.idleUltimo=Date.now();
  const res=simularIdle(Math.max(seg,240),0);
  if(res.ganho>1) mostrarDica("Seu carro coletou "+Math.round(res.ganho)+" de energia enquanto você esteve fora"
    +(res.cheia?" · bateria encheu e ele parou":""),6000);
}

function passoMapa(dt){
  if(!mapa)return; const m=mapa; m.t+=dt;

  m.proxima-=dt;
  if(m.proxima<=0){ if(m.cargas.length<ZONA.maxCargas) surgirCarga(m); m.proxima=ZONA.intervalo; }

  /* ATRIBUIÇÃO: cada carga é reivindicada por quem chega primeiro, e cada
     carro persegue a melhor entre as que ganhou. Sem isto os doze correm
     todos para a mesma carga e viram um bolo — que é tão sem vida quanto o
     beyblade que isto veio substituir. */
  const eta=(c,g)=>Math.hypot(g.x-c.x,g.z-c.z)/c.vel;
  const dono=new Array(m.cargas.length).fill(-1);
  for(let i=0;i<m.cargas.length;i++){
    let melhor=-1, melhorEta=1e9;
    for(let k=0;k<m.carros.length;k++){
      const e=eta(m.carros[k],m.cargas[i]);
      if(e<melhorEta){ melhorEta=e; melhor=k; }
    }
    dono[i]=melhor;
  }
  for(let k=0;k<m.carros.length;k++){
    const c=m.carros[k];
    let mel=-1, melE=1e9;
    for(let i=0;i<m.cargas.length;i++)
      if(dono[i]===k){ const e=eta(c,m.cargas[i]); if(e<melE){ melE=e; mel=i; } }
    if(mel<0)  // não ganhou nenhuma: vai atrás da mais próxima, com desconto
      for(let i=0;i<m.cargas.length;i++){
        const e=eta(c,m.cargas[i])*(dono[i]>=0?1.9:1);
        if(e<melE){ melE=e; mel=i; }
      }
    c.alvo=mel;
  }

  for(const c of m.carros){
    const mel=c.alvo;
    if(mel<0||mel>=m.cargas.length) continue;

    const g=m.cargas[mel];
    const ang=Math.atan2(g.z-c.z,g.x-c.x);
    let d=ang-c.h; while(d>Math.PI)d-=6.2832; while(d<-Math.PI)d+=6.2832;
    c.h+=cl(d,-c.giro*dt,c.giro*dt);
    const v=c.vel*(1-cl(Math.abs(d),0,1.5)*0.42);   // freia pra fazer a curva
    c.x+=Math.cos(c.h)*v*dt; c.z+=Math.sin(c.h)*v*dt;

    if(Math.hypot(g.x-c.x,g.z-c.z)<3.6){
      m.cargas.splice(mel,1); c.coletou++; m.total++;
      if(c.meu){
        m.minhas++; m.brilho=1;
        estado.energia=cl(estado.energia+ZONA.valor,0,BATERIA);
        if(m.minhas%10===0) salvar();
      }
    }
  }
  // separação: carro não atravessa carro nem no mapa
  for(let a=0;a<m.carros.length;a++) for(let b=a+1;b<m.carros.length;b++){
    const A=m.carros[a], B=m.carros[b];
    const dx=B.x-A.x, dz=B.z-A.z, d=Math.hypot(dx,dz);
    if(d>=6||d<1e-3) continue;
    const e=(6-d)*0.5, nx=dx/d, nz=dz/d;
    A.x-=nx*e; A.z-=nz*e; B.x+=nx*e; B.z+=nz*e;
  }
  if(m.brilho>0) m.brilho-=dt*2.4;
}

/* ══════════════════════════════════════════════════════════════════════════
   LOOP DE DESENHO
   ══════════════════════════════════════════════════════════════════════════ */
gl.enable(gl.DEPTH_TEST);
let acum=0, ultimo=performance.now();
function redim(){const r=Math.min(devicePixelRatio||1,2);
  const w=Math.max(1,innerWidth*r|0),h=Math.max(1,innerHeight*r|0);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}}

function desenhar(malha,M4){
  gl.bindVertexArray(malha.vao);
  gl.uniformMatrix4fv(gl.getUniformLocation(pObj,"uM"),false,M4);
  gl.drawArrays(gl.TRIANGLES,0,malha.n);
}

function quadro(agora){
  const dt=Math.min(.05,(agora-ultimo)/1000); ultimo=agora;
  if(tela==="corrida") lerGamepad();
  redim(); gl.viewport(0,0,cv.width,cv.height);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.depthMask(false); gl.disable(gl.DEPTH_TEST);
  gl.useProgram(pFundo);
  gl.uniform1f(gl.getUniformLocation(pFundo,"uLuz"),
    tela==="corrida" ? (PISOS[estado.piso]||PISOS.asfalto).ceu : 1.0);
  gl.bindVertexArray(vazio); gl.drawArrays(gl.TRIANGLES,0,3);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true);

  const asp=cv.width/cv.height;
  let proj, vista, olho, neb=140;

  if(tela==="corrida"&&corrida){
    acum+=dt;
    let it=0; while(acum>=DT && it++<260){ passoCorrida(); acum-=DT; }
    const p=corrida.pilotos[0], spd=Math.hypot(p.vx,p.vz);
    const dist=9.4+spd*0.085, alt=3.4+spd*0.016;
    const alvo=[p.x-Math.cos(p.h)*dist, alt, p.z-Math.sin(p.h)*dist];
    if(!corrida.cam) corrida.cam=alvo.slice();
    for(let i=0;i<3;i++) corrida.cam[i]=lerp(corrida.cam[i],alvo[i],1-Math.pow(0.0016,dt));
    olho=corrida.cam;
    // o turbo abre o ângulo e treme a câmera: sem isso o turbo é só uma
    // barra descendo, e ele precisa ser SENTIDO
    const kick=(p.turbando?1:0);
    corrida.kick=lerp(corrida.kick||0,kick,1-Math.pow(0.004,dt));
    proj=m4p(0.80+cl(spd/120,0,.22)+corrida.kick*0.16,asp,.15,420);
    if(corrida.kick>0.02){
      const a=corrida.kick*0.16;
      olho[0]+=(Math.random()-.5)*a; olho[1]+=(Math.random()-.5)*a; olho[2]+=(Math.random()-.5)*a;
    }
    // mira um pouco à frente do carro: é o que dá sensação de estar indo pra algum lugar
    vista=m4look(olho,[p.x+Math.cos(p.h)*4.5, 0.95, p.z+Math.sin(p.h)*4.5],[0,1,0]);
    motorSom(cl(spd/corrida.at.vmax,0,1), (teclas.arrowup||teclas.w)?1:0.2);
  } else if(tela==="mapa"){
    passoMapa(dt);
    const eu=mapa.carros[0];
    if(!mapa.cam) mapa.cam=[eu.x,eu.z];
    const k=1-Math.pow(0.0025,dt);
    mapa.cam[0]=lerp(mapa.cam[0],eu.x,k); mapa.cam[1]=lerp(mapa.cam[1],eu.z,k);
    const alt=165*mapa.zoom;   // enquadra a zona quase inteira: com a camera baixa a tela ficava vazia
    olho=[mapa.cam[0], alt, mapa.cam[1]+alt*0.60];
    proj=m4p(0.72,asp,.5,900); neb=420;
    vista=m4look(olho,[mapa.cam[0],0,mapa.cam[1]],[0,1,0]);
  } else {
    if(girando) camAng+=dt*0.26;
    const estreito=asp<0.85 ? 1.62 : asp<1.2 ? 1.18 : 1;
    const dist=camDist*estreito;
    olho=[Math.sin(camAng)*Math.cos(0.28)*dist, Math.sin(0.28)*dist+.55, Math.cos(camAng)*Math.cos(0.28)*dist];
    proj=m4p(0.72,asp,.1,300); neb=120;
    // com a gaveta ocupando a parte de baixo, o alvo desce para o carro
    // aparecer na faixa que sobrou em cima
    const gaveta = tela==="garagem" && innerHeight>innerWidth && innerWidth<=1000;
    vista=m4look(olho,[0,gaveta?-2.0:.62,0],[0,1,0]);
  }

  gl.useProgram(pObj);
  gl.uniformMatrix4fv(gl.getUniformLocation(pObj,"uP"),false,proj);
  gl.uniformMatrix4fv(gl.getUniformLocation(pObj,"uV"),false,vista);
  gl.uniform3fv(gl.getUniformLocation(pObj,"uEye"),new Float32Array(olho));
  gl.uniform1f(gl.getUniformLocation(pObj,"uNeb"),neb);
  gl.uniform3f(gl.getUniformLocation(pObj,"uTinta"),1,1,1);

  if(tela==="corrida"&&corrida){
    desenhar(malhaPista,m4pose(0,0,0,0));
    for(const g of corrida.perigos){
      const vida=cl(1-(corrida.t-g.t)/14,0,1);
      // a mancha deita no chão: X->X, Y->Z, Z(espessura)->Y
      const e=0.6+vida*0.6;
      desenhar(malhaMancha,new Float32Array([e,0,0,0, 0,0,e,0, 0,e,0,0, g.x,0.05,g.z,1]));
    }
    // a caixa cicla pelas cores dos itens: comunica sozinha que o que vem
    // de dentro é sorteio, em vez de ser sempre a mesma estrela laranja
    const paleta=Object.values(ITENS).map(it=>hex(it.cor));
    for(const cx of corrida.caixas){
      if(cx.volta>0) continue;
      // módulo SEMPRE positivo: corrida.t começa em -3,2 na contagem
      // regressiva e cx.x é negativo em metade da pista. O % do JavaScript
      // preserva o sinal, então paleta[índice negativo] era undefined e a
      // corrida explodia no primeiro quadro.
      const n=paleta.length;
      const f=(((corrida.t*0.8+cx.x*0.05)%n)+n)%n;
      const c0=paleta[Math.floor(f)], c1=paleta[(Math.floor(f)+1)%n], k=f%1;
      gl.uniform3f(gl.getUniformLocation(pObj,"uTinta"),
        lerp(c0[0],c1[0],k)*2.2, lerp(c0[1],c1[1],k)*2.2, lerp(c0[2],c1[2],k)*2.2);
      desenhar(malhaCaixa,m4pose(cx.x,2.0+Math.sin(corrida.t*2.4+cx.x)*0.26,cx.z,corrida.t*2.1,0.82));
      gl.uniform3f(gl.getUniformLocation(pObj,"uTinta"),1,1,1);
    }
    for(const e of corrida.efeitos){
      const v=(corrida.t-e.t)/0.75, r=e.raio*(0.25+v*1.5), br=(1-v)*(1-v);
      gl.uniform3f(gl.getUniformLocation(pObj,"uTinta"),e.cor[0]*br,e.cor[1]*br,e.cor[2]*br);
      desenhar(malhaAnel,new Float32Array([r,0,0,0, 0,0,r,0, 0,r,0,0, e.x,0.35,e.z,1]));
      gl.uniform3f(gl.getUniformLocation(pObj,"uTinta"),1,1,1);
    }
    corrida.pilotos.forEach((p,i)=>{
      const m=i===0?malhaCarro:malhaRival[(i-1)%malhaRival.length];
      desenharCarro(m,m4pose(p.x,0,p.z,-p.h), p.giroRoda||0, (p.dir||0)*0.5);
      if(p.turbando) fogoTurbo(m,p);
    });
  } else if(tela==="mapa"){
    desenhar(malhaChao,m4pose(0,0,0,0));
    mapa.cargas.forEach(g=>{
      const idade=mapa.t-g.nasceu;
      const pulso=1.05+Math.sin(mapa.t*3.4+g.x)*0.18;
      const nascendo=cl(idade*2.5,0,1);
      desenhar(malhaPoco,m4pose(g.x,0,g.z,mapa.t*1.1,pulso*nascendo*1.7));
    });
    mapa.carros.forEach((c,i)=>{
      const m=c.meu?malhaCarro:malhaRival[i%malhaRival.length];
      c.giroRoda=(c.giroRoda||0)+dt*c.vel*1.6;
      desenharCarro(m,m4pose(c.x,0,c.z,-c.h,2.1), c.giroRoda, 0);
    });
    // seta em cima do meu carro: sem isto não dá pra achar quem é você
    const eu=mapa.carros[0];
    // o anel é construído no plano XY, então deita no chão com uma pose própria
    // deita o anel: X do modelo -> X do mundo, Y do modelo -> Z do mundo,
    // e Z do modelo (a espessura) -> Y do mundo. Trocar as duas últimas fazia
    // o anel virar duas lascas de pé.
    const g=1+mapa.brilho*0.35, ang=mapa.t*0.9, ca=Math.cos(ang)*g, sa=Math.sin(ang)*g;
    desenhar(malhaSeta,new Float32Array([ca,0,sa,0, -sa,0,ca,0, 0,g,0,0, eu.x,0.10,eu.z,1]));
  } else {
    desenharCarro(malhaCarro,m4pose(0,0,0,0),0,0);
  }

  atualizarHUD();
  requestAnimationFrame(quadro);
}
