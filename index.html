<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Volta Rápida</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0C1014">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<canvas id="cv"></canvas>

<div class="ui" id="topo">
  <div class="marca">Circuito <b>Aberto</b></div>
  <div class="pilha"><div class="rot">Energia</div>
    <div class="linha"><span id="icE"></span>
      <div id="barraE"><i style="width:60%"></i></div>
      <div class="val" id="eTxt">480</div>
      <div class="taxa" id="eTaxa"></div></div></div>
  <div class="pilha"><div class="rot">Perícia</div>
    <div class="linha"><span id="icP"></span><div class="val" id="pTxt">0</div></div></div>
  <div class="pilha"><div class="rot">Sucata</div>
    <div class="linha"><span id="icS"></span><div class="val" id="sTxt">0</div></div></div>
  <div class="cresce"></div>
</div>

<div class="ui" id="nav">
  <button id="nGar" aria-pressed="true"><span class="mi"></span>Garagem</button>
  <button id="nMapa" aria-pressed="false"><span class="mi"></span>Mapa</button>
  <button id="nCor" aria-pressed="false"><span class="mi"></span>Correr</button>
  <button id="nSom" aria-pressed="false" title="som do motor"><span class="mi"></span>Som</button>
</div>

<aside class="ui" id="garagem"></aside>

<div class="ui" id="hud">
  <div id="volta"><div class="p">Volta</div><div class="v"><span id="vAtual">1</span>/2</div>
    <div class="piso" id="pisoHud">Asfalto</div></div>
  <div id="tempos"><div class="l">Volta atual</div><div class="t" id="tAtual">0.00</div>
    <div class="l" style="margin-top:8px">Melhor</div><div class="t d" id="tMelhor">—</div></div>
  <div id="vel"><div class="n" id="velN">0</div><div class="u">km/h</div></div>
  <div id="nitro"><div class="rot">Nitro · segure SHIFT</div><div class="nb"><i id="bNitro"></i></div></div>
  <div id="pecaHud" hidden></div>
  <div id="item">
    <div class="slots">
      <button class="slot" id="slot0" data-i="0"><span class="ico"></span><b class="nm">—</b><i class="tec">E</i></button>
      <button class="slot" id="slot1" data-i="1"><span class="ico"></span><b class="nm">—</b><i class="tec">TAB</i></button>
    </div>
    <div class="oq" id="oqItem">pegue as caixas na pista</div>
  </div>
  <div id="mini">
    <canvas id="miniCv" width="220" height="220"></canvas>
    <div class="pos"><b id="posN">1</b><span>/<i id="posT">8</i></span></div>
    <div id="vizinhos"></div>
  </div>
  <div id="perigo"></div>
  <div id="aviso"></div>
  <div id="pericia"></div>
</div>

<div class="ui" id="toque" hidden>
  <div id="manche" aria-label="direção"><i id="mancheBola"></i>
    <span class="mDica">guiar</span></div>
  <div class="lado dir">
    <button class="tq acao grande" data-k="shift" aria-label="turbo">TURBO</button>
  </div>
  <button id="sairCorrida" aria-label="sair da corrida">✕</button>
</div>
<div class="ui" id="girar" hidden>
  <span>Deite o celular para ver mais pista</span>
  <button id="btDeitar">Travar deitado</button>
</div>
<div id="portao" hidden>
  <div class="cx">
    <div class="marca">CIRCUITO<span>ABERTO</span></div>
    <div class="fone"><i></i></div>
    <p>O jogo é feito para a tela deitada. Travando a posição, nada
       sai do lugar no meio da corrida.</p>
    <button id="pgTravar">Travar deitado e jogar</button>
    <button id="pgPular" class="fraco">Jogar do jeito que está</button>
  </div>
</div>
<div class="ui" id="modal"></div>
<div class="ui" id="dica"></div>

<!-- Scripts CLÁSSICOS de propósito, não módulos ES: módulo não carrega em
     file:// e a regra do projeto é "abre direto no navegador, sem servidor".
     A ordem é a ordem de dependência de carga — não mude sem motivo. -->
<script src="graficos/icones.js"></script>
<script src="nucleo.js"></script>
<script src="graficos/geometria.js"></script>
<script src="graficos/cenario.js"></script>
<script src="graficos/render.js"></script>
<script src="som.js"></script>
<script src="entrada.js"></script>
<script src="graficos/efeitos.js"></script>
<script src="corrida.js"></script>
<script src="mapa.js"></script>
<script src="graficos/desenho.js"></script>
<script src="interface.js"></script>
<script src="principal.js"></script>
</body>
</html>
