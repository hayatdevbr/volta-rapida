<title>Volta Rápida</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0C1014">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#0C1014; --panel:#151B21; --line:#232C34; --line2:#1A2229;
    --tx:#DFE6EB; --tx2:#93A0AA; --tx3:#65727C;
    --amber:#E9992B; --patina:#5AA894; --oxide:#D2604A;
    --f-d: Bahnschrift,"DIN Alternate","Roboto Condensed","Arial Narrow",ui-sans-serif,sans-serif;
    --f-b: "Segoe UI",system-ui,-apple-system,sans-serif;
    --f-m: ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:var(--bg);color:var(--tx);font-family:var(--f-b);
       -webkit-font-smoothing:antialiased;user-select:none;
       touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100vw;height:100vh}

  .ui{position:fixed;pointer-events:none}
  .ui *{pointer-events:auto}

  /* ── barra de topo ── */
  #topo{top:0;left:0;right:0;display:flex;align-items:center;gap:20px;
        padding:12px 18px;background:linear-gradient(180deg,rgba(8,11,14,.92),rgba(8,11,14,0))}
  #topo .marca{font-family:var(--f-d);font-size:19px;letter-spacing:.05em;text-transform:uppercase;
               /* item centrado: a margem desloca metade, então vai o dobro */
               margin-top:calc(var(--sob-rotulo)*2)}
  #topo .marca b{color:var(--amber);font-weight:600}
  /* O rótulo empurrava o número para baixo: a barra centra o bloco inteiro,
     então quanto mais alto o rótulo, mais fundo o valor. Linha justa. */
  /* Metade do rótulo + gap: é exatamente o quanto o valor cai abaixo do centro
     do bloco. Quem não tem rótulo em cima desce isto para pousar na mesma
     linha dos números — que é o que o olho compara. */
  :root{ --sob-rotulo:5.25px }
  .pilha{display:flex;flex-direction:column;gap:1px}
  .rot{font-family:var(--f-m);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
       color:var(--tx3);line-height:1}
  .val{font-family:var(--f-d);font-size:17px;font-variant-numeric:tabular-nums}
  #barraE{width:150px;height:5px;background:var(--line);position:relative;overflow:hidden}
  #barraE i{position:absolute;inset:0 auto 0 0;background:var(--amber);transition:width .25s}
  .cresce{flex:1}

  /* ── navegação ── */
  /* o menu vive fora da barra: sem este acerto ele fica preso no topo
     enquanto energia, perícia e sucata se centram — e o desnível é visível */
  #nav{top:calc(20px + var(--sob-rotulo));right:18px;display:flex;gap:5px}
  #nav button,.btn{font-family:var(--f-d);font-size:13px;letter-spacing:.05em;text-transform:uppercase;
     background:rgba(21,27,33,.9);color:var(--tx2);border:1px solid var(--line);
     padding:8px 15px;cursor:pointer;transition:.12s}
  #nav button:hover,.btn:hover{color:var(--tx);border-color:var(--tx3)}
  #nav button{display:flex;align-items:center;gap:7px}
  #nav .mi{display:flex;align-items:center}
  #nav button[aria-pressed=true] .ic{filter:brightness(.25) saturate(0)}
  #nav button[aria-pressed=true]{background:var(--amber);color:#141414;border-color:var(--amber);font-weight:600}
  .btn.p{background:var(--amber);color:#141414;border-color:var(--amber);font-weight:600}
  .btn.p:hover{background:#c9821f;color:#141414}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  /* ── garagem ── */
  #garagem{right:0;top:64px;bottom:0;width:330px;background:rgba(21,27,33,.94);
           border-left:1px solid var(--line);overflow-y:auto;padding:0 0 20px}
  #garagem::-webkit-scrollbar{width:8px}
  #garagem::-webkit-scrollbar-thumb{background:var(--line)}
  .grp{padding:14px 16px;border-bottom:1px solid var(--line2)}
  .grp h3{font-family:var(--f-m);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;
          color:var(--amber);margin:0 0 10px;font-weight:400}
  .opc{display:flex;flex-direction:column;gap:4px}
  .opc button{text-align:left;font-family:var(--f-b);font-size:13px;background:#10151A;
      color:var(--tx2);border:1px solid var(--line);padding:7px 11px;cursor:pointer;
      display:flex;justify-content:space-between;align-items:center;gap:8px}
  .opc button:hover{border-color:var(--tx3);color:var(--tx)}
  .opc button>span{flex:1 1 auto;min-width:0}
  .opc .preco{flex:0 0 auto}
  .opc button[aria-pressed=true]{border-color:var(--amber);color:var(--tx);background:#1C232A}
  .opc button[aria-pressed=true]::after{content:"●";color:var(--amber);font-size:9px}
  .opc small{color:var(--tx3);font-family:var(--f-m);font-size:10px}

  .st{display:grid;grid-template-columns:76px 1fr 30px;gap:8px;align-items:center;margin-bottom:6px}
  .st .n{font-size:12px;color:var(--tx2)}
  .st .b{height:4px;background:var(--line);position:relative;overflow:hidden}
  .st .b i{position:absolute;inset:0 auto 0 0;background:var(--amber);transition:width .18s}
  .st .b.g i{background:var(--patina)} .st .b.r i{background:var(--oxide)}
  .st .q{font-family:var(--f-m);font-size:10.5px;text-align:right;font-variant-numeric:tabular-nums}
  .grp h3 .dur{float:right;font-family:var(--f-m);font-size:10px;letter-spacing:.06em;text-transform:none}
  .prox{background:#10161C}
  .prox .pisoNome{font-family:var(--f-d);font-size:27px;color:var(--amber);line-height:1;text-transform:uppercase}
  .prox .pisoDica{font-size:12.5px;color:var(--tx2);margin-top:4px}
  .opc button em{font-style:normal;font-family:var(--f-m);font-size:9.5px;letter-spacing:.08em;
                 text-transform:uppercase;margin-left:5px}
  .opc button em.bom{color:var(--patina)} .opc button em.ruim{color:var(--oxide)}
  .opc button.trava{opacity:.45}
  .opc button.trava.pode{opacity:.85;border-color:var(--amber)}
  .opc button.trava::after{content:none}
  .opc .preco{font-family:var(--f-m);font-size:10.5px;color:var(--amber);white-space:nowrap}
  .btn.semGrana{opacity:.45}

  /* ── HUD de corrida ── */
  #hud{inset:0;display:none}
  #hud.on{display:block}
  #vel{left:34px;bottom:28px;position:absolute;display:flex;align-items:baseline;gap:8px}
  #vel .n{font-family:var(--f-d);font-size:64px;line-height:.85;font-variant-numeric:tabular-nums;
          text-shadow:0 2px 18px rgba(0,0,0,.8)}
  #vel .u{font-family:var(--f-m);font-size:11px;letter-spacing:.16em;color:var(--tx3)}
  #tempos{right:232px;top:26px;position:absolute;text-align:right}
  #tempos .l{font-family:var(--f-m);font-size:10px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase}
  #tempos .t{font-family:var(--f-d);font-size:30px;font-variant-numeric:tabular-nums;line-height:1.05}
  #tempos .t.d{font-size:17px;color:var(--tx2)}
  #volta{left:34px;top:26px;position:absolute}
  #volta .v{font-family:var(--f-d);font-size:32px;line-height:1}
  #volta .p{font-family:var(--f-m);font-size:11px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase}
  #volta .piso{font-family:var(--f-m);font-size:11px;letter-spacing:.16em;color:var(--amber);
               text-transform:uppercase;margin-top:6px}
  #nitro{position:absolute;left:34px;bottom:118px;width:240px}
  #nitro .nb{height:11px;background:rgba(10,14,18,.8);position:relative;overflow:hidden;margin-top:5px;
             border:1px solid rgba(255,255,255,.10)}
  #nitro .nb i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#3E8A5B,#E9992B,#FFD36B);width:0%;
               transition:width .08s linear}
  #item{position:absolute;right:26px;bottom:20px;text-align:center}
  #item .slots{display:flex;gap:12px;justify-content:center}
  .slot{width:96px;height:96px;border-radius:50%;border:2px solid var(--line);
        background:rgba(12,16,20,.86);color:var(--tx2);cursor:pointer;position:relative;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
        transition:border-color .14s, box-shadow .14s, transform .14s;
        touch-action:none;-webkit-user-select:none;user-select:none}
  .slot .ico{height:44px;display:flex;align-items:center;justify-content:center}
  .slot .nm{font-family:var(--f-d);font-size:13px;letter-spacing:.05em;text-transform:uppercase;
            line-height:1;font-weight:600}
  .slot .tec{position:absolute;bottom:-17px;left:0;right:0;font-family:var(--f-m);font-size:9px;
             letter-spacing:.14em;color:var(--tx3);font-style:normal}
  .slot.tem{border-color:var(--amber);box-shadow:0 0 22px rgba(233,153,43,.26)}
  .slot.sel{transform:scale(1.08)}
  .slot.sel::after{content:"";position:absolute;inset:-7px;border-radius:50%;
                   border:2px solid var(--amber);opacity:.55}
  #item .oq{font-family:var(--f-m);font-size:10px;letter-spacing:.10em;text-transform:uppercase;
            color:var(--tx3);margin-top:24px;max-width:220px;margin-left:auto}
  @keyframes bate{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}
  .slot.novo{animation:bate .45s ease-out}
  #carro{position:absolute;left:34px;bottom:112px;display:flex;flex-direction:column;gap:7px;width:210px}
  .med{display:grid;grid-template-columns:44px 1fr 40px;gap:8px;align-items:center}
  .med span{font-family:var(--f-m);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--tx3)}
  .med .bar{height:5px;background:rgba(10,14,18,.75);position:relative;overflow:hidden}
  .med .bar i{position:absolute;inset:0 auto 0 0;background:var(--patina);width:100%;transition:width .1s linear}
  .med b{font-family:var(--f-m);font-size:11px;text-align:right;font-variant-numeric:tabular-nums;
         text-shadow:0 1px 6px rgba(0,0,0,.9)}
  /* vinheta vermelha pulsando: o alvo tem que SENTIR que está na mira, não
     ler um texto e voltar a olhar a pista */
  /* Minimapa: durante a corrida, saber ONDE se está e QUEM está chegando vale
     mais do que ver o menu. A barra de cima some junto. */
  #mini{position:absolute;right:20px;top:16px;width:170px;text-align:center}
  #mini canvas{width:170px;height:170px;display:block;
               background:rgba(10,14,18,.62);border:1px solid var(--line)}
  #mini .pos{font-family:var(--f-d);margin-top:2px;line-height:1}
  #mini .pos b{font-size:34px;color:var(--amber)}
  #mini .pos span{font-size:16px;color:var(--tx3)}
  #mini .pos i{font-style:normal}
  body.correndo #topo, body.correndo #nav{opacity:0;pointer-events:none;transition:opacity .25s}
  #perigo{position:absolute;inset:0;pointer-events:none;opacity:0;
     background:radial-gradient(ellipse at center,rgba(0,0,0,0) 38%,rgba(226,40,24,.62) 100%);
     transition:opacity .12s linear}
  #perigo.on{animation:pulsaPerigo .62s infinite}
  @keyframes pulsaPerigo{0%,100%{opacity:.35}50%{opacity:.95}}
  #aviso{position:absolute;left:50%;top:15%;transform:translateX(-50%);text-align:center;
         font-family:var(--f-d);font-size:78px;letter-spacing:.02em;text-shadow:0 4px 30px rgba(0,0,0,.9)}
  #aviso small{display:block;font-size:15px;letter-spacing:.2em;color:var(--tx2);margin-top:4px}
  #pericia{position:absolute;left:50%;top:25%;transform:translateX(-50%);
     font-family:var(--f-d);font-size:26px;color:var(--amber);opacity:0;text-shadow:0 2px 14px rgba(0,0,0,.9)}

  /* ── painel de fim / mapa ── */
  #modal{inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,11,14,.82)}
  #modal.on{display:flex}
  .cartao{background:var(--panel);border:1px solid var(--line);padding:30px 34px;min-width:380px;max-width:92vw}
  .cartao h2{font-family:var(--f-d);font-size:34px;text-transform:uppercase;margin:0 0 4px;letter-spacing:.02em}
  .cartao .sub{font-family:var(--f-m);font-size:11px;letter-spacing:.14em;color:var(--tx3);
               text-transform:uppercase;margin-bottom:20px}
  .linha{display:flex;justify-content:space-between;gap:24px;padding:8px 0;border-top:1px solid var(--line2);
         font-size:14px}
  .linha b{font-family:var(--f-m);font-variant-numeric:tabular-nums}
  .linha.d b{color:var(--amber)}
  .acoes{display:flex;gap:8px;margin-top:22px}
  .acoes .btn{flex:1;text-align:center;padding:11px}

  /* ── controles de toque ────────────────────────────────────────────────
     Sem isto o jogo é assistível no celular e injogável, e a maior parte das
     pessoas abre link no telefone. */
  #toque{inset:0;display:none}
  #toque.on{display:block}
  /* manche: um polegar só, e o acelerador é automático */
  #manche{position:absolute;left:20px;bottom:18px;width:132px;height:132px;border-radius:50%;
          background:rgba(20,26,32,.42);border:2px solid rgba(255,255,255,.14);
          touch-action:none;-webkit-user-select:none;user-select:none;
          display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
  #manche i{width:56px;height:56px;border-radius:50%;background:rgba(233,153,43,.55);
            border:2px solid rgba(255,255,255,.30);display:block;
            transition:transform .04s linear;pointer-events:none}
  #manche.puxado i{background:rgba(233,153,43,.85)}
  #manche .mDica{position:absolute;bottom:-19px;left:0;right:0;text-align:center;
                 font-family:var(--f-m);font-size:9px;letter-spacing:.16em;
                 text-transform:uppercase;color:var(--tx3);pointer-events:none}
  .lado{position:absolute;display:flex;gap:12px;align-items:center}
  .lado.dir{right:18px;bottom:24px}
  .tq{font-family:var(--f-d);font-size:14px;letter-spacing:.05em;color:var(--tx);
      background:rgba(20,26,32,.62);border:2px solid rgba(255,255,255,.16);
      width:86px;height:86px;border-radius:50%;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      touch-action:none;-webkit-user-select:none;user-select:none;
      backdrop-filter:blur(3px)}
  .tq.grande{width:104px;height:104px;font-size:15px;
             background:rgba(233,153,43,.30);border-color:rgba(233,153,43,.55)}
  .tq.peq{width:68px;height:68px;font-size:11px}
  .tq.ativo{background:rgba(233,153,43,.72);border-color:var(--amber);color:#141414}
  #sairCorrida{position:absolute;top:8px;right:10px;width:38px;height:38px;border-radius:50%;
      background:rgba(20,26,32,.7);border:1px solid rgba(255,255,255,.18);color:var(--tx2);
      font-size:16px;cursor:pointer;display:none}
  #toque.on #sairCorrida{display:block}
  /* O portão vem ANTES de tudo: pedir para travar a tela no meio da corrida
     é pedir no pior momento possível. Aqui não há nada acontecendo ainda, e
     o toque do usuário — que a API de tela cheia exige — vem de graça. */
  #portao{position:fixed;inset:0;z-index:99;background:var(--bg);
          display:flex;align-items:center;justify-content:center;padding:26px}
  /* Sem isto o `display:flex` acima vence o [hidden] do navegador e o portão
     NUNCA sai da frente — nem ao tocar no botão, nem no PC, onde ele nem
     deveria aparecer. */
  #portao[hidden]{display:none}
  #portao .cx{max-width:330px;text-align:center}
  #portao .marca{font-family:var(--f-d);font-size:27px;letter-spacing:.02em;
                 line-height:1.05;color:var(--tx)}
  #portao .marca span{display:block;color:var(--amber)}
  #portao .fone{margin:30px auto 24px;width:96px;height:60px}
  #portao .fone i{display:block;width:38px;height:64px;margin:-2px auto 0;
     position:relative;border:2px solid var(--tx3);border-radius:6px;
     animation:deita 2.6s cubic-bezier(.5,0,.2,1) infinite}
  /* alto-falante e botão: sem eles o retângulo lê como caixa, não telefone */
  #portao .fone i::before,#portao .fone i::after{content:"";position:absolute;
     left:50%;transform:translateX(-50%);background:var(--tx3)}
  #portao .fone i::before{top:5px;width:12px;height:2px;border-radius:2px}
  #portao .fone i::after{bottom:5px;width:10px;height:10px;border-radius:50%;
     background:none;border:1.5px solid var(--tx3)}
  @keyframes deita{0%,22%{transform:rotate(0) scale(1)}
                   48%,78%{transform:rotate(-90deg) scale(1.02)}
                   100%{transform:rotate(0) scale(1)}}
  #portao p{font-family:var(--f-b);font-size:14px;line-height:1.55;
            color:var(--tx2);margin:0 0 24px}
  #portao button{display:block;width:100%;font-family:var(--f-d);font-size:14px;
     letter-spacing:.05em;text-transform:uppercase;font-weight:600;cursor:pointer;
     background:var(--amber);color:#141414;border:0;padding:13px}
  #portao button.fraco{background:none;color:var(--tx3);margin-top:6px;
     font-size:11px;font-family:var(--f-m);letter-spacing:.1em;padding:11px}
  @media (prefers-reduced-motion:reduce){ #portao .fone i{animation:none;
     transform:rotate(-90deg)} }

  /* dica, não bloqueio: retrato tem que ser jogável, só mostra menos pista */
  #girar{left:50%;top:96px;transform:translateX(-50%);display:none;
         background:rgba(12,16,20,.92);border:1px solid var(--line);padding:9px 15px;
         font-family:var(--f-m);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
         color:var(--tx2);white-space:nowrap}
  #girar.on{display:flex;gap:12px;align-items:center}
  #girar button{font-family:var(--f-d);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    background:var(--amber);color:#141414;border:0;padding:7px 12px;cursor:pointer;font-weight:600}

  /* ── telas estreitas ── */
  /* Largura sozinha não identifica celular: deitado, um aparelho comum passa
     de 860px de largura com 375px de altura e caía no layout de PC — foi assim
     que a habilidade voltou a sentar em cima do TURBO. A altura é que denuncia. */
  @media (max-width:860px), (orientation:landscape) and (max-height:560px){
    #topo{gap:12px;padding:9px 12px}
    #topo .marca{font-size:15px}
    #topo .pilha .val{font-size:14px}
    #barraE{width:88px}
    #nav{top:calc(14px + var(--sob-rotulo));right:10px;gap:3px}
    #nav button{font-size:11px;padding:6px 9px}
    /* deitado, divide a tela para o carro continuar visível enquanto você
       troca peça; em pé, ocupa tudo porque não cabe de outro jeito */
    #garagem{width:100%;top:56px;border-left:0;border-top:1px solid var(--line)}
    #vel .n{font-size:40px}
    #volta .v{font-size:22px}
    #tempos .t{font-size:20px}
    #tempos .t.d{font-size:13px}
    #tempos{top:60px;right:14px}
    #volta{top:60px;left:16px}
    #nitro{left:16px;bottom:auto;top:104px;width:140px}
    /* Ficava em cima do manche: no deitado as habilidades sobem para a
       coluna do turbo, que é onde o polegar direito já está. */
    #item{width:auto;left:auto;right:22px;top:auto;bottom:126px;
          transform:none;text-align:center}
    #item .slots{flex-direction:column;gap:10px}
    #item .slot{width:74px;height:74px}
    #item .cx{padding:7px 8px}
    #item .cx span{font-size:17px}
    #item .oq{font-size:9px;margin-top:4px}
    /* o velocímetro sai do canto: ali ele fica embaixo do botão de virar */
    #vel{left:50%;transform:translateX(-50%);bottom:8px;align-items:baseline}
    #vel .n{font-size:34px;text-shadow:0 2px 12px rgba(0,0,0,.95)}
    #vel .u{font-size:9px}
    #dica{display:none}
    #mini{width:126px;right:12px;top:10px}
    #mini canvas{width:126px;height:126px}
    #mini .pos b{font-size:26px}
    #mini .pos span{font-size:12px}
    #tempos{right:150px;top:12px}
    #volta{top:12px;left:14px}
    /* o texto laranja colava no carro e parecia amador: sobe para o alto */
    #pericia{top:25%;font-size:18px}
    #aviso{font-size:52px;top:14%}
    .cartao{min-width:0;width:92vw;padding:22px 20px}
    .cartao h2{font-size:26px}
  }
  /* ── EM PÉ ─────────────────────────────────────────────────────────────
     O menu vira barra de abas embaixo, para nunca cobrir energia, perícia e
     sucata. A garagem vira gaveta de baixo, e o carro fica visível em cima. */
  @media (max-width:1000px) and (orientation:portrait){
    #topo{padding:10px 12px;gap:14px;flex-wrap:wrap}
    #topo .marca{font-size:16px;width:100%;margin-bottom:2px}
    #barraE{width:110px}
    #nav{top:auto;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);

<script>
"use strict";
// atalho no topo: declarado com const, usado antes daqui dava zona morta
const $=id=>document.getElementById(id);

/* ── ÍCONES ──────────────────────────────────────────────────────────────
   Construídos em 3D com as MESMAS primitivas, a MESMA luz e a MESMA paleta do
   carro, e renderizados uma vez na partida num viewport de 64x64. O resultado
   vira data URI e some da memória de vídeo.

   Ícone gerado por IA nunca casa com o jogo porque não sai do mesmo
   renderizador — sombra diferente, contorno diferente, paleta parecida mas
   não igual. Feito aqui, nasce nativo por construção. E volta a respeitar a
   lei do projeto: tudo sai de código.

   O fundo é magenta puro, cor que não existe em nenhuma peça, e vira alfa na
   hora de virar PNG. */
const ICONE = {};
/* 3D funciona para OBJETO (garrafa, roda, troféu) e falha para SÍMBOLO
   (energia, perícia). Símbolo quer forma chapada, contorno limpo e leitura
   instantânea a 20px — que é exatamente o que SVG faz melhor que render. */
const SVG = {
  energia:(t,c)=>`<svg class="ic" width="${t}" height="${t}" viewBox="0 0 24 24" fill="none">
    <path d="M13.6 2 4.5 13.4h5.3L9.2 22l9.6-11.9h-5.7L13.6 2Z" fill="${c||'#F5C244'}"
      stroke="#0C1014" stroke-width="1.4" stroke-linejoin="round"/></svg>`,
  pericia:(t,c)=>`<svg class="ic" width="${t}" height="${t}" viewBox="0 0 24 24" fill="none">
    <path d="M12 2.6 14.6 9h6.8l-5.5 4 2.1 6.6L12 15.6 6 19.6 8.1 13l-5.5-4h6.8L12 2.6Z"
      fill="${c||'#E9992B'}" stroke="#0C1014" stroke-width="1.4" stroke-linejoin="round"/></svg>`,
  mGaragem:(t,c)=>`<svg class="ic" width="${t}" height="${t}" viewBox="0 0 24 24" fill="none">
    <path d="M3 10.2 12 4l9 6.2V21H3V10.2Z" fill="${c||'#8A939B'}" stroke="#0C1014"
      stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M6.6 13h10.8M6.6 16.2h10.8M6.6 19.4h10.8" stroke="#0C1014" stroke-width="1.5"/></svg>`,
  mMapa:(t,c)=>`<svg class="ic" width="${t}" height="${t}" viewBox="0 0 24 24" fill="none">
    <path d="M2.6 5.6 9 3.2v15.2l-6.4 2.4V5.6Z" fill="${c||'#5AA894'}" stroke="#0C1014"
      stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M9 3.2 15 5.6v15.2L9 18.4V3.2Z" fill="${c||'#8A939B'}" stroke="#0C1014"
      stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M15 5.6 21.4 3.2v15.2L15 20.8V5.6Z" fill="${c||'#5E666E'}" stroke="#0C1014"
      stroke-width="1.4" stroke-linejoin="round"/></svg>`,
  mCorrer:(t,c)=>`<svg class="ic" width="${t}" height="${t}" viewBox="0 0 24 24" fill="none">
    <path d="M5 3v18" stroke="#0C1014" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M6.6 4.2h13.8v9.2H6.6V4.2Z" fill="${c||'#E9E4DA'}" stroke="#0C1014" stroke-width="1.4"/>
    <path d="M6.6 4.2h4.6v3.1H6.6zM15.8 4.2h4.6v3.1h-4.6zM11.2 7.3h4.6v3.1h-4.6zM6.6 10.4h4.6v3h-4.6zM15.8 10.4h4.6v3h-4.6z" fill="#0C1014"/></svg>`,
  mSom:(t,c)=>`<svg class="ic" width="${t}" height="${t}" viewBox="0 0 24 24" fill="none">
    <path d="M4 9.2h3.6L12.6 5v14l-5-4.2H4V9.2Z" fill="${c||'#8A939B'}" stroke="#0C1014"
      stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M15.8 9.2c1.4 1.6 1.4 4 0 5.6M18.4 6.6c2.8 3 2.8 7.8 0 10.8"
      stroke="${c||'#E9992B'}" stroke-width="1.9" stroke-linecap="round"/></svg>`,
  sucata:(t,c)=>`<svg class="ic" width="${t}" height="${t}" viewBox="0 0 24 24" fill="none">
    <path d="M3 15.5 8 9l4.4 3.6L16.4 7l4.6 8.5v4.2H3v-4.2Z" fill="${c||'#8A939B'}"
      stroke="#0C1014" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="17.6" cy="5.4" r="2.3" fill="#C07838" stroke="#0C1014" stroke-width="1.3"/></svg>`,
};
function icone(nome,tam,cor){ if(SVG[nome]) return SVG[nome](tam,cor);
  return ICONE[nome]
  ? '<img class="ic" src="'+ICONE[nome]+'" width="'+tam+'" height="'+tam+'" alt="">'
  : ''; }

/* Preguiçosa de propósito: este bloco fica no topo do arquivo, antes de hex()
   existir. Montar a paleta na declaração cairia na zona morta do const. */
let PAL = null;
function montarPaleta(){
  PAL = {
    aco:    hex("#8A939B"), aco2:  hex("#5E666E"), grafite: hex("#2A323A"),
    ambar:  hex("#E9992B"), ambar2:hex("#B8720F"), verde:   hex("#5AA894"),
    oxido:  hex("#D2604A"), creme: hex("#E9E4DA"), preto:   hex("#141A20"),
    ouro:   hex("#D9A62B"), cobre: hex("#C07838"), vidro:   hex("#2E4450"),
  };
}

/* Cada ícone é uma função que recebe o construtor e devolve o quanto a
   câmera precisa recuar para o objeto caber no quadro. */
const FORMAS = {
  energia(B){
    B.cilY(0,0,0,.62,1.35,10,PAL.ambar);
    B.disco(0,.675,0,.62,10,PAL.ambar2);
    B.cilY(0,.78,0,.24,.22,8,PAL.aco);
    // raio: três traços em zigue-zague, gordos o bastante para ler a 24px
    B.boxR(-.10,.30,.63,.46,.19,.10,-0.62,PAL.creme);
    B.boxR( .02,.02,.63,.34,.19,.10, 0.55,PAL.creme);
    B.boxR( .10,-.28,.63,.46,.19,.10,-0.62,PAL.creme);
    return 2.3;
  },
  pericia(B){
    for(let i=0;i<14;i++){ const a=i/14*6.2832;
      B.boxR(Math.cos(a)*.85,Math.sin(a)*.85,0,.42,.24,.24,a,PAL.grafite); }
    for(let k=0;k<3;k++){ const a=k/3*6.2832+1.05;
      B.boxR(Math.cos(a)*.44,Math.sin(a)*.44,0,.88,.20,.16,a,PAL.aco); }
    B.cilZ(0,0,0,.30,.26,10,PAL.aco2);
    B.disco(0,0,.14,.30,10,PAL.ambar);
    return 2.4;
  },
  sucata(B){
    const r=semente(4);
    for(let i=0;i<11;i++){
      const a=r()*6.2832, d=r()*.72, t=.30+r()*.26;
      B.boxR(Math.cos(a)*d, -.45+r()*.75, Math.sin(a)*d*.7, t,t*.7,t*.9, r()*3, r()<.35?PAL.aco2:PAL.aco);
    }
    B.cilZ(.42,.34,.42,.34,.16,8,PAL.cobre);
    return 2.5;
  },
  turbo(B){
    B.cilY(0,-.15,0,.46,1.25,10,PAL.oxido);
    B.disco(0,.475,0,.46,10,esc(PAL.oxido,1.3));
    B.disco(0,-.775,0,.46,10,esc(PAL.oxido,.6));
    B.cilY(0,.60,0,.17,.30,8,PAL.aco);
    for(let i=0;i<5;i++){ const a=i/5*6.2832;
      B.boxR(Math.cos(a)*.20,1.02+Math.sin(a)*.06,Math.sin(a)*.20,.34,.30,.22,a,i%2?PAL.ambar:PAL.creme); }
    return 2.5;
  },
  oleo(B){
    // poça larga e chata embaixo, lata deitada em cima e um fio caindo
    B.cilY(0,-.72,0,1.05,.14,16,PAL.grafite);
    B.disco(0,-.64,0,1.05,16,esc(PAL.grafite,1.9));
    B.cilZ(-.10,.42,0,.46,.86,12,PAL.ambar2);
    B.disco(-.10,.42,.44,.46,12,esc(PAL.ambar2,1.35));
    B.cilX(.46,.30,0,.11,.52,8,PAL.aco);          // bico
    B.box(.10,-.10,0,.14,.62,.14,esc(PAL.grafite,2.2));  // fio de óleo caindo
    return 2.5;
  },
  tranco(B){
    B.cilX(-.10,0,0,.40,1.30,10,PAL.aco);
    B.box(.72,0,0,.30,1.02,1.02,PAL.aco2);
    B.box(.92,0,0,.12,.80,.80,PAL.oxido);
    B.cilX(-.95,0,0,.24,.36,8,PAL.grafite);
    return 2.5;
  },
  recarga(B){
    B.cilY(0,0,0,.62,1.35,10,PAL.verde);
    B.disco(0,.675,0,.62,10,esc(PAL.verde,1.4));
    B.cilY(0,.78,0,.24,.22,8,PAL.aco);
    // raio: três traços em zigue-zague, gordos o bastante para ler a 24px
    B.boxR(-.10,.30,.63,.46,.19,.10,-0.62,PAL.creme);
    B.boxR( .02,.02,.63,.34,.19,.10, 0.55,PAL.creme);
    B.boxR( .10,-.28,.63,.46,.19,.10,-0.62,PAL.creme);
    return 2.3;
  },
  estouro(B){
    for(let i=0;i<8;i++){ const a=i/8*6.2832,a2=(i+1)/8*6.2832;
      B.tri([1.05,0,0],[.30,Math.cos(a)*.44,Math.sin(a)*.44],[.30,Math.cos(a2)*.44,Math.sin(a2)*.44],PAL.oxido); }
    B.cilX(-.20,0,0,.44,1.00,10,PAL.aco);
    for(let k=0;k<4;k++){ const a=k/4*6.2832;
      B.boxR(-.70,0,0,.42,.10,.10,0,PAL.oxido);
      B.box(-.70,Math.cos(a)*.52,Math.sin(a)*.52,.40,.34,.10,PAL.grafite); }
    B.anel(0,0,0,.86,1.02,16,PAL.ambar);
    return 2.6;
  },
  motor(B){
    B.box(0,0,0,1.10,.86,.94,PAL.aco2);
    B.box(0,.50,0,.94,.20,.80,PAL.aco);
    for(const z of [-.24,.24]) B.cilY(-.18,.72,z,.15,.34,8,PAL.creme);
    B.cilZ(.60,-.14,.56,.34,.30,10,PAL.ambar);
    B.cilZ(.60,-.14,.74,.14,.10,8,PAL.aco);
    B.box(-.66,-.10,0,.24,.50,.70,PAL.grafite);
    return 2.5;
  },
  roda(B){
    const seg=16, ri=.60;
    B.aro(0,0,-.34,.34,1.0,seg,PAL.preto);
    B.anel(0,0,-.34,ri,1.0,seg,esc(PAL.preto,1.7));
    B.anel(0,0,.34,ri,1.0,seg,esc(PAL.preto,1.7));
    B.disco(0,0,.30,ri,seg,PAL.grafite);
    B.anel(0,0,.36,ri*.86,ri,seg,PAL.aco);
    for(let k=0;k<5;k++){ const a=k/5*6.2832;
      B.boxR(Math.cos(a)*.30,Math.sin(a)*.30,.38,.52,.16,.06,a,PAL.creme); }
    B.cilZ(0,0,.40,.14,.10,8,PAL.ambar);
    return 2.3;
  },
  aerofolio(B){
    B.boxR(0,.42,0,1.60,.14,.62,-0.16,PAL.oxido);
    for(const z of [-.52,.52]) B.box(.10,-.10,z,.16,.90,.14,PAL.aco);
    for(const z of [-.80,.80]) B.box(0,.42,z,1.30,.44,.08,PAL.aco2);
    return 2.4;
  },
  trofeu(B){
    for(let i=0;i<12;i++){ const a=i/12*6.2832,a2=(i+1)/12*6.2832;
      const R1=.66,R2=.42;
      B.quad([Math.cos(a)*R1,.62,Math.sin(a)*R1],[Math.cos(a2)*R1,.62,Math.sin(a2)*R1],
             [Math.cos(a2)*R2,-.10,Math.sin(a2)*R2],[Math.cos(a)*R2,-.10,Math.sin(a)*R2],PAL.ouro); }
    B.disco(0,.62,0,.66,12,esc(PAL.ouro,1.4));
    B.cilY(0,-.34,0,.16,.50,8,PAL.ouro);
    B.cilY(0,-.66,0,.62,.22,10,esc(PAL.ouro,.7));
    for(const x of [-1,1]) B.boxR(x*.72,.34,0,.62,.16,.16,x*0.9,PAL.ouro);
    return 2.4;
  },
  cronometro(B){
    B.cilZ(0,0,0,.92,.34,18,PAL.aco2);
    B.disco(0,0,.19,.80,18,PAL.creme);
    B.anel(0,0,.21,.80,.92,18,PAL.aco);
    B.boxR(0,.18,.23,.12,.62,.06,0.5,PAL.oxido);
    B.cilZ(0,0,.24,.10,.06,8,PAL.grafite);
    B.box(0,1.02,0,.30,.22,.26,PAL.aco);
    for(let k=0;k<4;k++){ const a=k/4*6.2832;
      B.boxR(Math.cos(a)*.62,Math.sin(a)*.62,.20,.14,.10,.04,a,PAL.grafite); }
    return 2.4;
  },
  bandeira(B){
    B.cilY(-.86,0,0,.09,2.00,8,PAL.aco);
    for(let i=0;i<4;i++) for(let j=0;j<3;j++){
      const x=-.72+i*.44, y=.86-j*.40;
      B.box(x,y+Math.sin(i*1.1)*.10,0,.44,.40,.07,(i+j)%2?PAL.creme:PAL.grafite);
    }
    return 2.5;
  },
  chave(B){
    B.boxR(0,0,0,1.70,.30,.16,0.6,PAL.aco);
    B.boxR(-.62,.44,0,.52,.52,.18,0.6,PAL.aco);
    B.boxR(-.62,.44,.10,.26,.30,.10,0.6,PAL.grafite);
    B.boxR(0,0,.10,1.50,.22,.14,-0.6,PAL.aco2);
    B.boxR(.66,-.48,.10,.34,.34,.16,-0.6,PAL.ambar);
    return 2.6;
  },
  escudo(B){
    const c=hex("#5AC8E9"), b=hex("#2A6E88"), m=hex("#E9E4DA");
    // brasão: placa larga com bico embaixo
    B.quad([-.86,.95,0],[.86,.95,0],[.86,.10,0],[-.86,.10,0],c);
    B.tri([-.86,.10,0],[.86,.10,0],[0,-1.05,0],c);

/* Renderiza cada forma uma vez, num canto do canvas, e guarda como PNG. */
/* ALFA EXATO POR DOIS FUNDOS.
   Recortar por cor de chave deixa franja: o antialias mistura o fundo na
   borda, e nenhum limiar separa "meio magenta" de "objeto roxo". A saída é
   desenhar DUAS vezes, sobre magenta e sobre verde. Onde as duas leituras
   batem, é objeto opaco; onde diferem, a diferença É a transparência.
     p = O*(1-t) + fundo*t   →   t = (verde.g - magenta.g)/255
   Depois desfaz a pré-multiplicação para recuperar a cor limpa. */
function gerarIcones(){
  montarPaleta();
  const L=64;
  const c2=document.createElement("canvas"); c2.width=c2.height=L;
  const ctx=c2.getContext("2d");
  const img=ctx.createImageData(L,L);
  const bufM=new Uint8Array(L*L*4), bufV=new Uint8Array(L*L*4);

  gl.useProgram(pObj);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND);
  gl.uniform1f(gl.getUniformLocation(pObj,"uNeb"),1e6);
  gl.uniform3f(gl.getUniformLocation(pObj,"uTinta"),1,1,1);
  gl.uniform1f(gl.getUniformLocation(pObj,"uAlfa"),1);
  gl.uniform1f(gl.getUniformLocation(pObj,"uAlfa"),1);

  for(const nome of Object.keys(FORMAS)){
    const B=new M();
    const recuo=FORMAS[nome](B);
    const malha=subir(B);

    // 3/4 de cima, igual à garagem, para o ícone parecer o mesmo mundo
    const olho=[recuo*.62, recuo*.52, recuo*.78];
    const desenha=(cr,cg,cb,destino)=>{
      gl.viewport(0,0,L,L);
      gl.clearColor(cr,cg,cb,1);
      gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
      gl.uniformMatrix4fv(gl.getUniformLocation(pObj,"uP"),false,m4p(0.72,1,.1,60));
      gl.uniformMatrix4fv(gl.getUniformLocation(pObj,"uV"),false,m4look(olho,[0,0,0],[0,1,0]));
      gl.uniformMatrix4fv(gl.getUniformLocation(pObj,"uM"),false,m4pose(0,0,0,0));
      gl.uniform3fv(gl.getUniformLocation(pObj,"uEye"),new Float32Array(olho));
      gl.bindVertexArray(malha.vao);
      gl.drawArrays(gl.TRIANGLES,0,malha.n);
      gl.readPixels(0,0,L,L,gl.RGBA,gl.UNSIGNED_BYTE,destino);
    };
    desenha(1,0,1,bufM);      // magenta
    desenha(0,1,0,bufV);      // verde

    for(let y=0;y<L;y++) for(let x=0;x<L;x++){
      const o=((L-1-y)*L+x)*4, d=(y*L+x)*4;      // WebGL lê de baixo pra cima
      const t=cl((bufV[o+1]-bufM[o+1])/255,0,1); // quanto de fundo entrou
      const a=1-t;
      if(a<=0.004){ img.data[d+3]=0; continue; }
      // magenta é (255,0,255): VERMELHO e azul recebem fundo, verde não.
      // Corrigir só o azul deixava franja rosa sobre fundo claro.
      img.data[d]  =cl((bufM[o]  -255*t)/a,0,255);
      img.data[d+1]=cl( bufM[o+1]     /a,0,255);
      img.data[d+2]=cl((bufM[o+2]-255*t)/a,0,255);
      img.data[d+3]=Math.round(a*255);
    }
    ctx.putImageData(img,0,0);
    ICONE[nome]=c2.toDataURL("image/png");
  }
  gl.enable(gl.BLEND);
  gl.clearColor(0,0,0,1);
}

/* ══════════════════════════════════════════════════════════════════════════
   CIRCUITO ABERTO — vertical slice (Fase 2)

   O que este protótipo existe para responder: É DIVERTIDO SEM PRÊMIO NENHUM?
   Não há mercado, não há Ficha, não há dinheiro. Só o laço:
       mapa idle rende Energia → Energia paga corrida → corrida dá Perícia,
       Sucata e desgaste → peça melhor → carro melhor → corrida melhor.

   Arquitetura provada aqui: as MESMAS malhas low-poly servem a câmera
   traseira da corrida e a câmera de cima do mapa idle. Câmera não é decisão
   de asset. Zero textura, zero modelo importado, zero dependência.

   O bloco NÚCLEO abaixo é determinístico e não toca em DOM nem em WebGL —
   é o que vira código de servidor na Fase 3 sem reescrever nada.
   ══════════════════════════════════════════════════════════════════════════ */

/* ─────────────────────────── util ─────────────────────────── */
const cl=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const suave=t=>{t=cl(t,0,1);return t*t*(3-2*t);};
const gauss=(x,m,s)=>Math.exp(-((x-m)*(x-m))/(2*s*s));
function semente(n){let a=n>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const hex=h=>{const n=parseInt(h.slice(1),16),f=v=>Math.pow(v/255,2.2);
  return[f((n>>16)&255),f((n>>8)&255),f(n&255)];};
const esc=(c,k)=>[c[0]*k,c[1]*k,c[2]*k];
const tempo=s=>s<0?"—":(Math.floor(s/60)?Math.floor(s/60)+":":"")+ (s%60).toFixed(2).padStart(Math.floor(s/60)?5:4,"0");

/* Peça gasta rende menos. Não é punição no meio da corrida — é conta a pagar
   entre uma e outra, que é onde a Sucata deixa de ser número decorativo. */
function fatorDur(k){ return 0.62 + 0.38*cl((estado.dur[k]||0)/100,0,1); }
function custoReparo(){
  let t=0;
  for(const k of ["chassi","motor","rodas","aero"]){
    const falta=100-(estado.dur[k]||0);
    t += falta * (0.5 + PECAS[k][estado.build[k]].custo/900);
  }
  return Math.round(t);
}
function atributos(piso){
  const P=PISOS[piso||estado.piso||"asfalto"];
  const p=k=>PECAS[k][estado.build[k]];
  const c=p("chassi"), m=p("motor"), r=p("rodas"), a=p("aero");
  const nomePiso=piso||estado.piso||"asfalto";
  const af=(x)=>(x.piso&&x.piso[nomePiso])||1;      // afinidade da peça com o piso
  const peso=c.peso*m.peso;
  const potencia = 11.5 * c.pot * m.pot * fatorDur("motor") / peso;
  const arrasto  = 0.0026 * a.arrasto * P.arrasto;
  // velocidade terminal resolvida da própria equação de movimento, para o
  // número da garagem ser o número que o carro faz de verdade na pista
  const vmax = (-0.18 + Math.sqrt(0.0324 + 4*arrasto*potencia)) / (2*arrasto);
  return {
    potencia, arrasto, vmax, peso, piso:nomePiso,
    aderencia: 3.05 * c.aderencia * r.aderencia * a.aderencia
             * P.aderencia * af(c) * af(r) * af(a)
             * (0.70+0.30*fatorDur("rodas")) * (0.85+0.15*fatorDur("chassi")),
    terra: 0.55 + 0.45*af(c)*af(r),      // o quanto sofre fora da pista
  };
}

/* ── pista: laço fechado gerado por spline, com blocos de meio-fio ── */
/* Cada piso é um LUGAR, não uma cor. O traçado muda de caráter:

     asfalto  autódromo — poucas curvas, amplas, reta longa, pista larga
     terra    rali      — sinuoso, curva fechada, largura que aperta e abre
     chuva    circuito urbano — cantos de 90 graus, estreito, sem escapatória

   É isso que faz correr na terra ser diferente de correr no asfalto, muito
   mais do que trocar a cor do chão. */
function gerarPista(sem, piso){
  const r=semente(sem);
  piso = piso || "asfalto";
  let ctrl=[], SUB=14, larguraBase=19, aperto=7;

  if(piso==="asfalto"){
    const N=11;
    for(let i=0;i<N;i++){
      const a=i/N*Math.PI*2, rad=210+r()*70;
      ctrl.push([Math.cos(a)*rad, Math.sin(a)*rad]);
    }
    // uma reta longa: dois pontos quase alinhados
    ctrl[0][0]*=1.22; ctrl[0][1]*=1.22;
    larguraBase=21; aperto=6;

  } else if(piso==="terra"){
    const N=17;
    for(let i=0;i<N;i++){
      const a=i/N*Math.PI*2, rad=150+r()*130;      // raio muito variável = sinuoso
      ctrl.push([Math.cos(a)*rad, Math.sin(a)*rad]);
    }
    larguraBase=16; aperto=9; SUB=12;

  } else {                                        // chuva: circuito urbano
    const N=12, quadra=95;
    for(let i=0;i<N;i++){
      const a=i/N*Math.PI*2, rad=200+r()*60;
      // encaixa na malha das quadras: é o que gera canto de rua
      ctrl.push([Math.round(Math.cos(a)*rad/quadra)*quadra,
                 Math.round(Math.sin(a)*rad/quadra)*quadra]);
    }
    larguraBase=18; aperto=4; SUB=13;             // canto radiado, não faca
  }

  const N=ctrl.length;
  const cr=(p0,p1,p2,p3,t)=>{const t2=t*t,t3=t2*t;
    return [0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
            0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)];};
  const meio=[];
  for(let i=0;i<N;i++) for(let sI=0;sI<SUB;sI++)
    meio.push(cr(ctrl[(i-1+N)%N],ctrl[i],ctrl[(i+1)%N],ctrl[(i+2)%N],sI/SUB));

  const n=meio.length, dados=[];
  let total=0;
  for(let i=0;i<n;i++){
    const a=meio[(i-1+n)%n], b=meio[i], c=meio[(i+1)%n];
    let tx=c[0]-a[0], tz=c[1]-a[1]; const l=Math.hypot(tx,tz)||1; tx/=l; tz/=l;
    const curv=Math.abs(Math.atan2(c[1]-b[1],c[0]-b[0])-Math.atan2(b[1]-a[1],b[0]-a[0]));
    const larg=larguraBase - cl(curv,0,.5)*aperto;
    // a→b é UM segmento; o *0.5 daqui fazia o perímetro sair pela metade,
    // e a IA calcula a distância de frenagem a partir dele
    total+=Math.hypot(b[0]-meio[(i-1+n)%n][0], b[1]-meio[(i-1+n)%n][1]);
    dados.push({x:b[0],z:b[1],tx,tz,nx:-tz,nz:tx,larg,s:total});
  }
  return {pontos:dados, n, comprimento:total, piso};
}

/* Índice do ponto mais próximo — busca local, porque o carro anda contínuo. */
function maisProximo(pista, x, z, ult){
  let mel=ult, md=1e9;
  for(let k=-14;k<=14;k++){
    const i=(ult+k+pista.n)%pista.n, p=pista.pontos[i];
    const d=(p.x-x)**2+(p.z-z)**2;
    if(d<md){md=d;mel=i;}
  }
  return {i:mel, dist:Math.sqrt(md)};
}

/* ── física arcade, passo fixo, determinística ──
   O deslize nasce de a velocidade NÃO acompanhar a rotação do carro: gira
   forte em velocidade, a lateral cresce, o pneu arrasta e o carro derrapa.
   Determinística de propósito: na Fase 3 o servidor re-simula o log de

const DT=1/120;
/* GRID mora aqui, e não junto do desenho, porque o sorteio de item depende

const GRID=8;   // com quatro dava para passar todo mundo em uma volta

  tranco: { nome:"Tranco", cor:"#D2604A", peso:[0,2,4,6], ic:"tranco" },
  reparo: { nome:"Recarga",cor:"#5AA894", peso:[3,4,5,5], ic:"recarga" },
  // ESTOURO: só cai pra quem está em 3º ou 4º e acerta o LÍDER onde ele
  // estiver. É o que impede a corrida de virar procissão depois que alguém
  // abre vantagem — sem algo assim, quem lidera aos 40% vence sempre.
  estouro:{ nome:"Estouro", cor:"#E9552B", peso:[0,0,2,5], ic:"estouro" },
  // Escudo é ITEM, não um improviso: quem se prepara para o estouro tomou
  // uma decisão, em vez de simplesmente ter sobrado algo no bolso.
  /* Com peso 7 na frente, o líder tirava escudo em um terço das caixas e o
     míssil virava enfeite. Escudo forte no miolo, raro na ponta: quem lidera
     ter defesa passa a ser sorte, não regra. */
  escudo: { nome:"Escudo",  cor:"#5AC8E9", peso:[2,5,5,4], ic:"escudo" },
};
function sortearItem(posicao){
  /* A tabela tem quatro faixas e o grid tem oito carros: sem esticar, do 5º ao
     8º todos caíam na mesma faixa e o fundo do pelotão perdia a mão boa. */
  const ch=Object.keys(ITENS);
  const i=cl(Math.floor((posicao-1)/Math.max(1,GRID-1)*4),0,3);
  let soma=0; for(const k of ch) soma+=ITENS[k].peso[i];
  let r=Math.random()*soma;
  for(const k of ch){ r-=ITENS[k].peso[i]; if(r<=0) return k; }
  return "turbo";
}


function passo(c, ent, at, naPista, terra){
  const spd=Math.hypot(c.vx,c.vz);

  // volante: afina em alta velocidade, mas nunca some
  const dirMax=1-0.40*cl(spd/44,0,1);
  c.dir=lerp(c.dir, ent.dir*dirMax, 0.26);

  // gira o carro primeiro; a velocidade fica pra trás e é isso que vira deslize
  c.h += c.dir*2.95*cl(spd/5,0,1)*DT*(c.vl<0?-1:1);

  const cs=Math.cos(c.h), sn=Math.sin(c.h);
  let vl= c.vx*cs+c.vz*sn, vt=-c.vx*sn+c.vz*cs;

  const superficie = naPista?1:terra;
  // turbo: força extra ao custo de nitro e de MUITO calor
  c.turbando = 0;
  if(ent.turbo && (c.nitro||0)>0.5 && vl>-1){
    c.nitro = Math.max(0,(c.nitro||0) - NITRO.gasto*DT);
    c.turbando = 1;
  }
  const potMult = c.turbando ? NITRO.forca : 1;
  if(ent.acel>0 || c.turbando) vl += Math.max(ent.acel,c.turbando?0.9:0)*at.potencia*potMult*superficie*DT;
  if(ent.freio)  vl -= (vl>0.5?26:8)*DT;          // segurando parado, engata a ré
  vl -= vl*Math.abs(vl)*at.arrasto*DT;
  vl *= 1-(naPista?0.18:1.7)*DT;
  vl = cl(vl,-11,at.vmax);

  // ADERÊNCIA COM ORÇAMENTO DE DESLIZE.
  // Antes, QUALQUER curva descontava velocidade e o carro parecia freado a
  // cada volante. Agora o pneu tem uma cota de escorregada de graça e só o
  // EXCESSO arranha — que é o que faz curva rápida ser prazerosa e derrapada
  // grande ser cara.
  const freioDeMao = ent.mao ? 0.30 : 1;
  if(c.oleado>0) c.oleado-=DT;
  const ader = at.aderencia*(naPista?1:0.5*terra)*freioDeMao*(c.oleado>0?0.28:1);
  vt *= Math.exp(-ader*DT);
  const excesso = Math.max(0, Math.abs(vt) - ORCAMENTO_DESLIZE);
  vl -= excesso*1.15*DT;
  c.derrapa = Math.abs(vt);                        // o quanto está de lado AGORA

  c.vl=vl;
  c.giroRoda=(c.giroRoda||0) - vl*DT*2.9;      // roda gira com o chão passando
  c.vx=vl*cs-vt*sn; c.vz=vl*sn+vt*cs;
  c.x+=c.vx*DT; c.z+=c.vz*DT;
}

/* ── mapa idle: simulado por tick, recuperável offline ──
   Nada disso depende de aba aberta. Ao entrar no mapa a gente recalcula o
   que aconteceu desde a última visita — que é como o servidor faria. */
function simularIdle(segundos, nivelSensor){
  const r=semente(estado.idleSemente++);
  const porHora=55*(1+nivelSensor*0.03);
  const disputa=0.55+r()*0.25;              // fatia da zona que coube ao seu carro
  const ganho=porHora*(segundos/3600)*disputa*2;
  const antes=estado.energia;
  estado.energia=cl(estado.energia+ganho,0,BATERIA);
  return {ganho:estado.energia-antes, cheia:estado.energia>=BATERIA};
}

/* ══════════════════════════════════════════════════════════════════════════
   GEOMETRIA — construtor de malha e carro paramétrico
   ══════════════════════════════════════════════════════════════════════════ */
class M{
  constructor(){this.p=[];this.n=[];this.c=[];}
  tri(a,b,c,col){const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
    let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;const l=Math.hypot(nx,ny,nz)||1;
    nx/=l;ny/=l;nz/=l;
    for(const v of[a,b,c]){this.p.push(v[0],v[1],v[2]);this.n.push(nx,ny,nz);this.c.push(col[0],col[1],col[2]);}}
  quad(a,b,c,d,col){this.tri(a,b,c,col);this.tri(a,c,d,col);}
  boxR(cx,cy,cz,sx,sy,sz,ang,col){const co=Math.cos(ang),si=Math.sin(ang),hx=sx/2,hy=sy/2,hz=sz/2;
    const P=(a,b,c)=>[cx+a*co-b*si,cy+a*si+b*co,cz+c];
    const v=[P(-hx,-hy,-hz),P(hx,-hy,-hz),P(hx,hy,-hz),P(-hx,hy,-hz),
             P(-hx,-hy,hz),P(hx,-hy,hz),P(hx,hy,hz),P(-hx,hy,hz)];
    this.quad(v[4],v[5],v[6],v[7],col);this.quad(v[1],v[0],v[3],v[2],col);
    this.quad(v[0],v[1],v[5],v[4],col);this.quad(v[3],v[7],v[6],v[2],col);
    this.quad(v[1],v[2],v[6],v[5],col);this.quad(v[0],v[4],v[7],v[3],col);}
  box(cx,cy,cz,sx,sy,sz,col){this.boxR(cx,cy,cz,sx,sy,sz,0,col);}
  cilX(cx,cy,cz,r,len,seg,col){const x0=cx-len/2,x1=cx+len/2;
    for(let i=0;i<seg;i++){const a0=i/seg*6.2832,a1=(i+1)/seg*6.2832;
      const p0=[cy+Math.cos(a0)*r,cz+Math.sin(a0)*r],p1=[cy+Math.cos(a1)*r,cz+Math.sin(a1)*r];
      this.quad([x0,p0[0],p0[1]],[x1,p0[0],p0[1]],[x1,p1[0],p1[1]],[x0,p1[0],p1[1]],col);}}
  cilY(cx,cy,cz,r,len,seg,col){const y0=cy-len/2,y1=cy+len/2;
    for(let i=0;i<seg;i++){const a0=i/seg*6.2832,a1=(i+1)/seg*6.2832;
      const p0=[cx+Math.cos(a0)*r,cz+Math.sin(a0)*r],p1=[cx+Math.cos(a1)*r,cz+Math.sin(a1)*r];
      this.quad([p0[0],y0,p0[1]],[p0[0],y1,p0[1]],[p1[0],y1,p1[1]],[p1[0],y0,p1[1]],col);
      this.tri([cx,y1,cz],[p0[0],y1,p0[1]],[p1[0],y1,p1[1]],col);}}
  cilZ(cx,cy,cz,r,len,seg,col){const z0=cz-len/2,z1=cz+len/2;
    for(let i=0;i<seg;i++){const a0=i/seg*6.2832,a1=(i+1)/seg*6.2832;
      const p0=[cx+Math.cos(a0)*r,cy+Math.sin(a0)*r],p1=[cx+Math.cos(a1)*r,cy+Math.sin(a1)*r];
      this.quad([p0[0],p0[1],z0],[p0[0],p0[1],z1],[p1[0],p1[1],z1],[p1[0],p1[1],z0],col);}
    this.disco(cx,cy,z1,r,seg,col);this.disco(cx,cy,z0,r,seg,col);}
  aro(cx,cy,z0,z1,r,seg,col){for(let i=0;i<seg;i++){const a0=i/seg*6.2832,a1=(i+1)/seg*6.2832;
    const p0=[cx+Math.cos(a0)*r,cy+Math.sin(a0)*r],p1=[cx+Math.cos(a1)*r,cy+Math.sin(a1)*r];
    this.quad([p0[0],p0[1],z0],[p0[0],p0[1],z1],[p1[0],p1[1],z1],[p1[0],p1[1],z0],col);}}
  anel(cx,cy,z,ri,ro,seg,col){for(let i=0;i<seg;i++){const a0=i/seg*6.2832,a1=(i+1)/seg*6.2832;
    const c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1);
    this.quad([cx+c0*ri,cy+s0*ri,z],[cx+c0*ro,cy+s0*ro,z],[cx+c1*ro,cy+s1*ro,z],[cx+c1*ri,cy+s1*ri,z],col);}}
  disco(cx,cy,z,r,seg,col){for(let i=0;i<seg;i++){const a0=i/seg*6.2832,a1=(i+1)/seg*6.2832;
    this.tri([cx,cy,z],[cx+Math.cos(a0)*r,cy+Math.sin(a0)*r,z],[cx+Math.cos(a1)*r,cy+Math.sin(a1)*r,z],col);}}
}

function nrm(P){let a=cl(P.tHood,.10,.50),b=Math.max(a+.05,P.tWs),c=Math.max(b+.05,P.tRoof),
  d=Math.min(Math.max(c+.05,P.tDeck),.95); c=Math.min(c,d-.04);b=Math.min(b,c-.04);a=Math.min(a,b-.04);
  return{a,b,c,d};}
function teto(P,t,S){const nose=Math.max(P.ride+.06,P.hoodH-P.noseDrop),{a,b,c,d}=S;
  if(t<a)return lerp(nose,P.hoodH,suave(t/a));
  if(t<b)return lerp(P.hoodH,Math.max(P.hoodH+.05,P.roofH),suave((t-a)/(b-a)));
  if(t<c)return Math.max(P.hoodH+.05,P.roofH);
  if(t<d)return lerp(Math.max(P.hoodH+.05,P.roofH),P.deckH,suave((t-c)/(d-c)));
  return lerp(P.deckH,P.deckH+(P.ducktail||0),suave((t-d)/(1-d)));}
function meiaLarg(P,t){let s=1;
  s-=P.noseTaper*Math.pow(cl((0.26-t)/0.26,0,1),1.7);
  s-=P.tailTaper*Math.pow(cl((t-0.74)/0.26,0,1),1.7);
  s+=P.flare*gauss(t,P.axF,.075)+P.flare*gauss(t,P.axR,.075);
  return Math.max(.07,(P.width*.5)*s);}

/* Carro: seção de 12 pontos com LINHA DE CINTURA e arco de roda — as duas
   coisas que fazem a malha ler como carro em vez de cunha maciça. */
function construirCarro(P){
  const B=new M(), S=nrm(P), L=P.length;
  const corpo=hex(P.colBody), acc=hex(P.colAcc);
  const vidro=[.020,.030,.042], sob=esc(corpo,.16), grade=[.030,.036,.044];
  const pneu=[.0135,.0145,.0165], fundoAro=[.028,.032,.038], metal=esc(acc,.85), saia=esc(corpo,.42);
  const RF=P.wheelR, RR=P.wheelR*(P.rearRatio||1);
  const arco=t=>{let a=0;for(const[ax,R]of[[P.axF,RF],[P.axR,RR]]){
    const u=Math.abs(t-ax)/((R*1.16)/L); if(u<1)a=Math.max(a,Math.sqrt(1-u*u)*R*1.05);} return a;};

  const N=48, sec=[];
  for(let i=0;i<N;i++){
    const t=i/(N-1), x=L*.5-t*L;
    const yb=Math.max(P.ride-(t<.10?.020*(1-t/.10):0), arco(t));
    const yt=Math.max(yb+.16, teto(P,t,S)), hw=meiaLarg(P,t);
    const yBelt=cl(P.hoodH*.90, yb+.10, yt-.02), gh=Math.max(0,yt-yBelt);
    const ghw=Math.max(.04, hw*(1-P.tumble*cl(gh/.34,0,1))), sh=Math.min(.055,gh*.42);
    const ch=Math.max(.006,Math.min(P.chamfer,hw*.38,ghw*.38,(yBelt-yb)*.40,Math.max(.01,gh-sh)*.55));
    sec.push({x,yb,yt,hw,ghw,yBelt,sh,ch,t,gh});
  }
  const anelS=s=>[[s.x,s.yb,-s.hw*.90+s.ch],[s.x,s.yb+s.ch,-s.hw*.90],[s.x,s.yBelt,-s.hw],
    [s.x,s.yBelt+s.sh,-s.ghw],[s.x,s.yt-s.ch,-s.ghw],[s.x,s.yt,-s.ghw+s.ch],
    [s.x,s.yt,s.ghw-s.ch],[s.x,s.yt-s.ch,s.ghw],[s.x,s.yBelt+s.sh,s.ghw],
    [s.x,s.yBelt,s.hw],[s.x,s.yb+s.ch,s.hw*.90],[s.x,s.yb,s.hw*.90-s.ch]];

  for(let i=0;i<N-1;i++){
    const A=anelS(sec[i]),Bv=anelS(sec[i+1]);
    const tm=(sec[i].t+sec[i+1].t)*.5, gm=(sec[i].gh+sec[i+1].gh)*.5;
    for(let e=0;e<12;e++){const e2=(e+1)%12; let col;
      if(e===11) col=sob;
      else if(e===0||e===10) col=saia;
      else if((e===3||e===7)&&gm>.055) col=vidro;
      else if(e===5&&((tm>S.a&&tm<S.b)||(tm>S.c&&tm<S.d))) col=vidro;
      else col=corpo;
      B.quad(A[e],A[e2],Bv[e2],Bv[e],col);}
  }
  const tampa=(s,col,fl)=>{const r=anelS(s),cy=(s.yb+s.yBelt)/2;
    for(let e=0;e<12;e++){const e2=(e+1)%12;
      fl?B.tri([s.x,cy,0],r[e2],r[e],col):B.tri([s.x,cy,0],r[e],r[e2],col);}};
  tampa(sec[0],grade,false); tampa(sec[N-1],grade,true);

  /* A roda sai do corpo e vira malha própria, em raio 1 e centrada na origem.
     Assada dentro do corpo ela não tinha como girar — e carro com roda parada
     lê como maquete. Aqui ela é desenhada 4 vezes, com giro e esterço. */
  /* DUAS malhas de roda, uma por lado, em vez de espelhar por escala.
     Escala negativa inverte o determinante da matriz: a normal vira ao
     contrário E o gl_FrontFacing também, então a correção de face dupla se
     anula e o lado esquerdo saía cinza-chapado enquanto o direito ficava
     preto. Construir os dois é mais barato que acertar isso no shader. */
  const seg=18, ri=.62, cubo=.16, meia=P.wheelW*.5;
  const fazRoda=(sinal)=>{
    const W=new M(), fora=sinal*meia;          // face decorada para fora
    W.aro(0,0,-meia,meia,1,seg,pneu);
    W.anel(0,0,-meia,ri,1,seg,esc(pneu,1.5));
    W.anel(0,0, meia,ri,1,seg,esc(pneu,1.5));
    W.disco(0,0,fora-sinal*.02,ri,seg,fundoAro);
    W.anel(0,0,fora-sinal*.035,ri*.87,ri,seg,metal);
    const ns=Math.max(3,Math.round(P.spokes)), raioCor=esc(metal,.78);
    for(let k=0;k<ns;k++){const ang=k/ns*6.2832, rr=ri*.47;
      W.boxR(Math.cos(ang)*rr, Math.sin(ang)*rr, fora-sinal*.032, ri*.80, ri*.17,.05,ang,raioCor);}
    W.cilZ(0,0,fora-sinal*.03,cubo,.06,10,metal);
    return W;
  };
  const W=fazRoda(1), Wesq=fazRoda(-1);
  const posRodas=[];
  for(const [t,R,frente] of [[P.axF,RF,true],[P.axR,RR,false]]){
    const x=L*.5-t*L, hw=meiaLarg(P,t);
    for(const sg of [-1,1])
      // lado espelha a malha: o aro e os raios só existem numa face, e sem
      // espelhar a roda esquerda mostrava o lado liso pra fora
      posRodas.push({x, y:R, z:sg*(hw+.022-P.wheelW*.5), r:R, frente, lado:sg});
  }

  const w=P.wing|0;
  if(w>0){const tw=.92,xw=-L*.5+(w===1?.16:.34),hwT=meiaLarg(P,tw),dk=teto(P,tw,S);
    if(w===1) B.boxR(xw,dk+.04,0,.26,.06,hwT*1.80,-0.20,acc);
    else{const h=w===2?.20:.32, span=hwT*2*(w===2?.94:1.02), chord=w===2?.28:.36;
      for(const s of[-1,1]) B.box(xw+.03,dk+h/2,s*span*.32,.075,h,.06,metal);
      B.boxR(xw,dk+h,0,chord,.042,span,-0.19,acc);
      if(w===3) for(const s of[-1,1]) B.box(xw,dk+h+.045,s*span*.5,chord*.95,.13,.032,metal);}}

  const en=P.engine|0;
  if(en>0){const te=Math.min(S.a*.62,.24), xe=L*.5-te*L, ye=teto(P,te,S);
    if(en===1) B.boxR(xe,ye+.055,0,.72,.12,P.width*.34,0.06,esc(corpo,.7));
    if(en===2){B.box(xe,ye+.10,0,.62,.20,P.width*.36,metal);
      for(let k=-1;k<=1;k+=2)for(let j=-1;j<=1;j+=2) B.cilY(xe+k*.17,ye+.28,j*P.width*.11,.055,.20,10,esc(acc,1.1));}
    if(en===3){B.box(xe,ye+.13,0,.66,.26,P.width*.32,esc(metal,.75));
      B.cilZ(xe,ye+.30,0,.13,P.width*.34,12,metal);
      B.box(xe-.05,ye+.44,0,.34,.10,P.width*.26,esc(acc,1.05));}}

  const cano=esc(metal,.62);
  for(const s of[-1,1]) B.cilX(-L*.5+.09,P.ride+.045,s*P.width*.17,.044,.32,10,cano);
  return { corpo:B, roda:W, rodaEsq:Wesq, posRodas, escape:[-L*.5+.02, P.ride+.05, P.width*.17] };
}


/* ── CENÁRIO ──────────────────────────────────────────────────────────────
   Pista sozinha no vazio não tem escala nem velocidade: sem nada passando do
   lado, 200 km/h parece 40. O cenário é o que dá referência — e é onde o
   low-poly rende mais por triângulo, porque forma boa em silhueta não precisa
   de detalhe nenhum.

   Cada piso tem o seu mundo: autódromo, rali de montanha, circuito urbano. */
function construirCenario(pista, piso){
  const B=new M(), r=semente(pista.n*7+1);
  const pts=pista.pontos, n=pista.n;

  const arvore=(x,z,esc)=>{
    const h=(5+r()*4)*esc, tronco=hex("#4A3524");
    const folha=r()<.5?hex("#2E5B3A"):hex("#254A31");
    B.cilY(x,h*.30,z,.55*esc,h*.6,6,tronco);
    for(let k=0;k<3;k++){
      const yy=h*(.55+k*.22), rr=(2.6-k*.7)*esc;
      for(let i=0;i<6;i++){ const a=i/6*6.2832,a2=(i+1)/6*6.2832;
        B.tri([x,yy+2.2*esc,z],[x+Math.cos(a)*rr,yy,z+Math.sin(a)*rr],
              [x+Math.cos(a2)*rr,yy,z+Math.sin(a2)*rr],folha); }
    }
  };
  const pedra=(x,z)=>{
    const t=1.2+r()*2.2, c=hex(r()<.5?"#5E666E":"#4A5158");
    B.boxR(x,t*.35,z,t*1.6,t*.8,t*1.3,r()*3,c);
  };
  const predio=(x,z,alt)=>{
    const l=9+r()*10, p2=9+r()*10;
    const corpo=hex(["#2A323A","#343E48","#232B33"][Math.floor(r()*3)]);
    B.box(x,alt*.5,z,l,alt,p2,corpo);
    B.box(x,alt+.6,z,l*1.06,1.2,p2*1.06,hex("#1A2028"));
    // janelas acesas: cor alta demais para o tonemap, então brilham
    const jan=[2.4,1.9,.6];
    for(let a=3;a<alt-2;a+=4.5) for(let k=-1;k<=1;k++){
      if(r()<.45) continue;
      B.box(x+l*.51, a, z+k*p2*.28, .12, 1.5, 2.0, jan);
      B.box(x-l*.51, a, z+k*p2*.28, .12, 1.5, 2.0, jan);
    }
  };
  const arquibancada=(x,z,ang)=>{
    const cor=hex("#3A444E"), banco=hex("#8A939B");
    for(let k=0;k<5;k++)
      B.boxR(x - Math.sin(ang)*k*1.5, 1.0+k*1.15, z + Math.cos(ang)*k*1.5,
             26, .9, 1.4, ang, k%2?cor:banco);
    B.boxR(x,.5,z,26,1,7,ang,hex("#232B33"));
  };
  const torreLuz=(x,z)=>{
    B.cilY(x,7,z,.42,14,6,hex("#5E666E"));
    B.box(x,14.6,z,5.5,1.4,1.4,hex("#3A444E"));
    for(let k=-2;k<=2;k++) B.box(x+k*1.15,15.5,z,.9,.7,.9,[3.2,3.0,2.4]);
  };
  const muroPneu=(x,z,ang)=>{
    for(let k=-3;k<=3;k++){
      const px=x+Math.cos(ang)*k*1.7, pz=z+Math.sin(ang)*k*1.7;
      B.cilY(px,.7,pz,.85,1.4,8, k%2?hex("#141A20"):hex("#D2604A"));
    }
  };
  const poste=(x,z,lado)=>{
    B.cilY(x,4.2,z,.22,8.4,6,hex("#5E666E"));
    B.box(x+lado*1.1,8.2,z,2.4,.3,.3,hex("#5E666E"));
    B.box(x+lado*2.1,8.0,z,1.1,.42,.7,[3.0,2.6,1.6]);
  };
  const feno=(x,z,ang)=>{
    for(let k=-1;k<=1;k++)
      B.cilZ(x+Math.cos(ang)*k*2.4, 1.0, z+Math.sin(ang)*k*2.4, 1.0, 2.0, 8,
             k===0?hex("#D9A62B"):hex("#C9922B"));
  };

  const passo = piso==="chuva" ? 7 : 5;
  for(let i=0;i<n;i+=passo){
    const p=pts[i];
    const q=pts[(i+3)%n];
    const curva=Math.abs(Math.atan2(q.tz,q.tx)-Math.atan2(p.tz,p.tx));
    for(const lado of [-1,1]){
      const d=p.larg/2 + 12 + r()*22;
      const x=p.x+p.nx*lado*d, z=p.z+p.nz*lado*d;
      const ang=Math.atan2(p.tz,p.tx);
      if(piso==="terra"){
        if(r()<.62) arvore(x,z,.9+r()*.6);
        else if(r()<.6) pedra(x,z);
        if(curva>.22 && r()<.5) feno(p.x+p.nx*lado*(p.larg/2+5), p.z+p.nz*lado*(p.larg/2+5), ang);
      } else if(piso==="chuva"){
        if(r()<.85) predio(p.x+p.nx*lado*(p.larg/2+34+r()*22),
                           p.z+p.nz*lado*(p.larg/2+34+r()*22), 14+r()*30);
        if(r()<.5) poste(p.x+p.nx*lado*(p.larg/2+5.5), p.z+p.nz*lado*(p.larg/2+5.5), lado);
      } else {
        if(r()<.22) arquibancada(x,z,ang);
        else if(r()<.30) torreLuz(x,z);
        else if(r()<.45) arvore(x,z,.7+r()*.4);
        if(curva>.25 && r()<.55) muroPneu(p.x+p.nx*lado*(p.larg/2+5.0),
                                          p.z+p.nz*lado*(p.larg/2+5.0), ang+1.5708);
      }
    }
  }
  return B;
}

/* ── malha da pista: asfalto, meio-fio, grama, linha de largada ── */
function construirPista(pista, nomePiso){
  const B=new M(), PI=PISOS[nomePiso||"asfalto"];
  const asf=PI.pista, mf1=[.30,.045,.035], mf2=[.62,.60,.56], gr=PI.grama;
  const pts=pista.pontos, n=pista.n;
  // chão até onde a névoa alcança: sem isto a grama termina numa parede e
  // aparece o vazio do lado de fora das curvas
  const F=900, ch=esc(PI.grama,0.62);
  B.quad([-F,-.09,-F],[F,-.09,-F],[F,-.09,F],[-F,-.09,F],ch);
  for(let i=0;i<n;i++){
    const p=pts[i], q=pts[(i+1)%n];
    const L=(o,w)=>[o.x+o.nx*w, .02, o.z+o.nz*w];
    B.quad(L(p,-p.larg/2),L(q,-q.larg/2),L(q,q.larg/2),L(p,p.larg/2),asf);
    // meio-fio zebrado dos dois lados
    const cor=(i%6<3)?mf1:mf2;
    for(const s of[-1,1]){
      const a=L(p,s*p.larg/2), b=L(q,s*q.larg/2);
      const a2=L(p,s*(p.larg/2+1.5)), b2=L(q,s*(q.larg/2+1.5));
      a[1]=b[1]=.03; a2[1]=b2[1]=.10;
      B.quad(a,b,b2,a2,cor);
    }
    // faixa de grama larga só para o olho ter referência de velocidade
    for(const s of[-1,1]){
      const a=L(p,s*(p.larg/2+1.5)), b=L(q,s*(q.larg/2+1.5));
      const a2=L(p,s*(p.larg/2+70)), b2=L(q,s*(q.larg/2+70));
      a[1]=b[1]=.10; a2[1]=b2[1]=-.07;
      B.quad(a,b,b2,a2, (i%2? gr : esc(gr,1.35)));
    }
  }
  const p0=pts[0], br=[.80,.80,.78];
  for(let k=-3;k<=3;k++){
    const w=k*1.4;
    B.box(p0.x+p0.nx*w, .045, p0.z+p0.nz*w, 1.2, .01, 1.2, (k%2?br:[.05,.05,.05]));
  }
  return B;
}

function prog(vs,fs){const c=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;};
  const p=gl.createProgram();gl.attachShader(p,c(gl.VERTEX_SHADER,vs));gl.attachShader(p,c(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  return p;}
const TONE=`vec3 aces(vec3 x){const float a=2.51,b=.03,c=2.43,d=.59,e=.14;
  return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.,1.);} vec3 saida(vec3 c){return pow(aces(c),vec3(1./2.2));}`;

const pObj=prog(`#version 300 es
layout(location=0)in vec3 aP;layout(location=1)in vec3 aN;layout(location=2)in vec3 aC;
uniform mat4 uP,uV,uM;out vec3 vN,vW,vC;
void main(){vec4 w=uM*vec4(aP,1.);vW=w.xyz;vN=mat3(uM)*aN;vC=aC;gl_Position=uP*uV*w;}`,
`#version 300 es
precision highp float;in vec3 vN,vW,vC;uniform vec3 uEye;uniform float uNeb;uniform vec3 uTinta;uniform float uAlfa;out vec4 o;
${TONE}
void main(){
  vec3 N=normalize(vN); if(!gl_FrontFacing)N=-N;
  vec3 V=normalize(uEye-vW);
  vec3 K=normalize(vec3(.55,.80,.30)),F1=normalize(vec3(-.70,.34,-.50)),F2=normalize(vec3(.10,.16,-.98));
  vec3 amb=mix(vec3(.105,.118,.140),vec3(.36,.405,.465),N.y*.5+.5);
  vec3 c=vC*uTinta*(amb+vec3(1.22,1.10,.90)*max(dot(N,K),0.)
        +vec3(.22,.32,.46)*max(dot(N,F1),0.)+vec3(.17,.20,.27)*max(dot(N,F2),0.));
  c+=vec3(1.,.92,.78)*pow(max(dot(N,normalize(K+V)),0.),64.)*.15;
  c+=vec3(.42,.58,.82)*pow(1.-max(dot(N,V),0.),3.4)*.22;
  float d=length(uEye-vW);
  c=mix(c, vec3(.030,.042,.056), clamp((d-70.)/uNeb,0.,.82));
  o=vec4(saida(c),uAlfa);}`);

const pFundo=prog(`#version 300 es
out vec2 vU;void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);vU=p;gl_Position=vec4(p*2.-1.,0.,1.);}`,
`#version 300 es
precision highp float;in vec2 vU;uniform float uLuz;uniform vec3 uCeu;out vec4 o;${TONE}
void main(){
  // céu em três faixas — alto, meio e horizonte — mais um sol baixo que
  // sangra na linha do chão. Gradiente de duas cores era o teto do visual.
  float h=vU.y;
  vec3 alto = uCeu*vec3(.10,.14,.22);
  vec3 meio = uCeu*vec3(.30,.34,.40);
  vec3 baixo= uCeu*vec3(.62,.56,.48);
  vec3 c = h>.55 ? mix(meio,alto,smoothstep(.55,1.,h))
                 : mix(baixo,meio,smoothstep(.10,.55,h));
  // sol: um halo largo e um núcleo pequeno, ambos rentes ao horizonte
  vec2 sol=vec2(.68,.30);
  float d=distance(vU*vec2(1.7,1.),sol*vec2(1.7,1.));
  c += uCeu*vec3(.9,.62,.32)*smoothstep(.62,.0,d)*.55;
  c += uCeu*vec3(1.6,1.2,.7)*smoothstep(.075,.0,d);
  // banda quente colada no horizonte
  c += uCeu*vec3(.34,.24,.14)*smoothstep(.22,.02,abs(h-.16));
  c*=uLuz; o=vec4(saida(c),1.);}`);

const vazio=gl.createVertexArray();
function subir(mesh){
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const dados=[new Float32Array(mesh.p),new Float32Array(mesh.n),new Float32Array(mesh.c)];
  dados.forEach((a,i)=>{const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,a,gl.STATIC_DRAW);gl.enableVertexAttribArray(i);
    gl.vertexAttribPointer(i,3,gl.FLOAT,false,0,0);});
  gl.bindVertexArray(null);
  return {vao, n:mesh.p.length/3};
}
const m4p=(fy,as,n,f)=>{const t=1/Math.tan(fy/2);
  return new Float32Array([t/as,0,0,0,0,t,0,0,0,0,(f+n)/(n-f),-1,0,0,2*f*n/(n-f),0]);};
function m4look(e,c,u){let z=[e[0]-c[0],e[1]-c[1],e[2]-c[2]];let l=Math.hypot(...z)||1;z=z.map(v=>v/l);
  let x=[u[1]*z[2]-u[2]*z[1],u[2]*z[0]-u[0]*z[2],u[0]*z[1]-u[1]*z[0]];l=Math.hypot(...x)||1;x=x.map(v=>v/l);
  const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];
  return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,
    -(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]),-(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]),-(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]),1]);}
function m4pose(x,y,z,ang,esc=1){const c=Math.cos(ang)*esc,s=Math.sin(ang)*esc;
  return new Float32Array([c,0,-s,0, 0,esc,0,0, s,0,c,0, x,y,z,1]);}

const som={ctx:null,on:false,osc:[],ganho:null,ruido:null};
function ligarSom(){
  if(som.ctx)return;
  som.ctx=new (window.AudioContext||window.webkitAudioContext)();
  const g=som.ctx.createGain(); g.gain.value=0; g.connect(som.ctx.destination);
  som.ganho=g;
  for(const[tipo,det,vol] of [["sawtooth",0,.22],["square",-.02,.11],["sawtooth",.013,.09]]){
    const o=som.ctx.createOscillator(), gg=som.ctx.createGain();
    o.type=tipo; gg.gain.value=vol; o.connect(gg); gg.connect(g); o.start();
    som.osc.push({o,det});
  }
  const f=som.ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=1400;
}
function motorSom(rpm,carga){
  if(!som.on||!som.ctx)return;
  const base=52+rpm*118;
  for(const{o,det} of som.osc) o.frequency.setTargetAtTime(base*(1+det),som.ctx.currentTime,.03);
  som.ganho.gain.setTargetAtTime(0.035+carga*0.075,som.ctx.currentTime,.05);
}

/* ── toque ──────────────────────────────────────────────────────────────
   Um manche para guiar e dois botões de ação. O acelerador é AUTOMÁTICO:
   com quatro botões de pressionar era preciso uma terceira mão. */
const ehToque = ("ontouchstart" in window) || navigator.maxTouchPoints>0;
const manche = { dir:0, freio:false, id:null, cx:0, cy:0, r:56 };
(function(){
  const el=document.getElementById("manche"), bola=document.getElementById("mancheBola");
  const solta=()=>{ manche.dir=0; manche.freio=false; manche.id=null;
    el.classList.remove("puxado"); bola.style.transform="translate(0,0)"; };
  el.addEventListener("pointerdown",e=>{
    e.preventDefault(); manche.id=e.pointerId; el.setPointerCapture(e.pointerId);
    const r=el.getBoundingClientRect(); manche.cx=r.left+r.width/2; manche.cy=r.top+r.height/2;
    manche.r=r.width*0.42; el.classList.add("puxado"); mover(e);
    ligarSomSeMudo();
  });
  el.addEventListener("pointermove",e=>{ if(manche.id===e.pointerId){e.preventDefault(); mover(e);} });
  el.addEventListener("pointerup",e=>{ if(manche.id===e.pointerId) solta(); });
  el.addEventListener("pointercancel",solta);
  function mover(e){
    let dx=e.clientX-manche.cx, dy=e.clientY-manche.cy;
    const d=Math.hypot(dx,dy), lim=manche.r;
    if(d>lim){ dx*=lim/d; dy*=lim/d; }
    bola.style.transform="translate("+dx.toFixed(0)+"px,"+dy.toFixed(0)+"px)";
    manche.dir=cl(dx/lim,-1,1);
    manche.freio=dy>lim*0.55;      // puxar pra trás freia e dá ré
  }
})();

/* Travar a orientação só funciona em tela cheia, e o Safari do iPhone não
   implementa a API. Então é BOTÃO, não automático: onde dá, trava; onde não
   dá, o aviso de deitar continua valendo e nada quebra. */
async function travarDeitado(){
  try{
    const el=document.documentElement;
    if(el.requestFullscreen) await el.requestFullscreen();
    else if(el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
    if(screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape");
    return true;
  }catch(e){
    /* iPhone não tem a API, e alguns Android recusam fora de tela cheia. Não é
       erro: o retrato continua jogável, só mostra menos pista. */
    mostrarDica("SEU APARELHO NÃO DEIXA TRAVAR A TELA — GIRE NA MÃO MESMO",4200);
    return false;
  }
}

function prepararCarro(P){

           posRodas:c.posRodas, escape:c.escape };
}
function reconstruirCarro(){
  malhaCarro=prepararCarro(montar());

  const cores=[["#2E6B8C","#DDE4E8"],["#3E8A5B","#F0E9DC"],["#8C5A2E","#E9DCC8"]];
