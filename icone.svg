  <circle cx="48" cy="48" r="34" fill="none" stroke="#E9992B" stroke-width="7"/>
  <g fill="#E9E4DA">
    <rect x="38" y="30" width="10" height="10"/>
    <rect x="48" y="40" width="10" height="10"/>
    <rect x="38" y="50" width="10" height="10"/>
    <rect x="48" y="30" width="10" height="10" fill="#141A20"/>
    <rect x="38" y="40" width="10" height="10" fill="#141A20"/>
    <rect x="48" y="50" width="10" height="10" fill="#141A20"/>
  </g>
</svg>
